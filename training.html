<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素組教育訓練系統 v1.7.3 (Full Compatibility)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        
        .custom-checkbox input:checked + div {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .custom-checkbox input:checked + div svg {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-900">

    <!-- 加載中遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center p-6 text-center">
        <div id="loadingCore">
            <div class="spinner mb-4 mx-auto"></div>
            <p class="text-gray-500 animate-pulse font-bold text-lg">訓練系統啟動中...</p>
            <p id="loadingStatus" class="text-gray-400 text-xs mt-2">正在建立雲端安全連線...</p>
        </div>
        <div id="loadingError" class="hidden max-w-sm">
            <i class="fas fa-wifi-slash text-rose-500 text-5xl mb-4"></i>
            <h3 class="font-bold text-gray-800 text-xl">連線逾時</h3>
            <p class="text-gray-500 text-sm mt-2 mb-6">目前無法與雲端資料庫同步。這可能是由於網路限制。您可以進入「離線模式」先行編輯。</p>
            <div class="flex flex-col gap-2">
                <button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg">重新嘗試連線</button>
                <button onclick="skipLoading()" class="bg-gray-100 text-gray-500 px-6 py-3 rounded-xl font-bold">進入離線模式</button>
            </div>
        </div>
    </div>

    <!-- 頂部導航列 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-black bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                        <i class="fas fa-graduation-cap mr-2"></i>教育訓練系統 v1.7.3
                    </span>
                    <span id="syncStatus" class="ml-4 px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-100 text-gray-400">
                        <i class="fas fa-circle-notch animate-spin mr-1"></i>連線中
                    </span>
                </div>
                <div class="flex items-center space-x-1 md:space-x-2">
                    <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn active px-3 py-2 rounded-md text-sm font-medium border border-transparent transition-all">儀表板</button>
                    <button onclick="switchTab('initial')" id="btn-initial" class="nav-btn px-3 py-2 rounded-md text-sm font-medium border border-transparent transition-all">必修</button>
                    <button onclick="switchTab('courses')" id="btn-courses" class="nav-btn px-3 py-2 rounded-md text-sm font-medium border border-transparent transition-all">評分</button>
                    <button onclick="switchTab('admin')" id="btn-admin" class="nav-btn px-3 py-2 rounded-md text-sm font-medium border border-rose-200 text-rose-600 hover:bg-rose-50 transition-all"><i class="fas fa-user-shield mr-1"></i>管理端</button>
                    <button onclick="exportToExcel()" title="匯出 Excel" class="hidden md:block text-emerald-600 px-2 hover:bg-emerald-50 rounded transition-colors"><i class="fas fa-file-excel"></i></button>
                    <button onclick="resetData()" title="重置個人進度" class="text-rose-600 px-2 hover:bg-rose-50 rounded transition-colors"><i class="fas fa-redo-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">

        <!-- TAB 1: 儀表板 -->
        <div id="dashboard" class="tab-content active space-y-6">
            <div class="bg-indigo-600 rounded-xl shadow-lg p-6 text-white border-b-4 border-indigo-800">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-lg font-bold"><i class="fas fa-sync-alt mr-2"></i>載入個人/量身計畫</h2>
                        <p class="text-xs opacity-70 mt-1 text-indigo-100">輸入您的識別碼以同步進度。系統會自動載入全域或管理者為您設定的專屬計畫。</p>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="syncKey" class="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-white/50 w-full md:w-64 font-bold" placeholder="輸入識別碼 (如姓名)">
                        <button onclick="applySync()" class="bg-white text-indigo-600 px-6 py-2 rounded-lg font-bold hover:bg-indigo-50 transition-all shadow-md">同步進度</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">姓名</label>
                        <input type="text" id="userName" oninput="debouncedSave()" class="block w-full rounded-lg border-gray-200 shadow-sm sm:text-sm border p-2.5 bg-gray-50 font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">區域</label>
                        <select id="userRegion" onchange="debouncedSave()" class="block w-full rounded-lg border-gray-200 shadow-sm sm:text-sm border p-2.5 bg-gray-50 font-bold">
                            <option value="">選擇區域</option>
                            <option value="北區">北區</option>
                            <option value="中區">中區</option>
                            <option value="南區">南區</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">到職日</label>
                        <input type="date" id="startDate" oninput="debouncedSave()" class="block w-full rounded-lg border-gray-200 shadow-sm sm:text-sm border p-2.5 bg-gray-50 font-bold">
                    </div>
                    <div class="flex flex-col justify-center items-center md:items-end">
                        <div id="displayLevel" class="text-5xl font-black text-blue-600 italic">Lv 0</div>
                        <div class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest font-bold">Rank</div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white border-l-8 border-blue-600 rounded-xl shadow-sm p-6">
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">總積分</div>
                    <div class="text-4xl font-black mt-1 text-gray-800" id="displayTotalScore">0</div>
                    <div class="mt-4 text-xs font-bold text-blue-600 bg-blue-50 inline-block px-2 py-1 rounded">達成率: <span id="displayScoreRatio">0%</span></div>
                </div>
                <div class="bg-white border-l-8 border-amber-500 rounded-xl shadow-sm p-6 flex flex-col justify-between">
                    <div>
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">下個等級: <span id="nextLevelName" class="text-amber-600">--</span></div>
                        <div class="flex items-baseline">
                            <span class="text-4xl font-black text-gray-800" id="displayDistToUpgrade">--</span>
                            <span class="ml-2 text-gray-400 text-xs italic">pts left</span>
                        </div>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-2 mt-4 overflow-hidden">
                        <div class="bg-amber-500 h-2 rounded-full transition-all duration-1000" id="levelProgressBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="bg-white border-l-8 border-emerald-500 rounded-xl shadow-sm p-6">
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">計畫狀態</div>
                    <div class="text-2xl font-black text-gray-800 mt-2" id="planTypeDisplay">載入中...</div>
                    <div class="mt-3 flex items-center text-[10px] text-emerald-600 font-bold italic">
                        <i class="fas fa-bullseye mr-1"></i> 目標滿分: <span id="displayMaxScore" class="ml-1">0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="dashboardAnalysis"></div>
        </div>

        <!-- TAB 2: INITIAL -->
        <div id="initial" class="tab-content space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-100 bg-amber-50 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-amber-900">必修核心計畫進度</h3>
                        <p class="text-xs text-amber-700 mt-1" id="initialPlanName">準備中...</p>
                    </div>
                    <div class="text-xs font-bold text-amber-800 bg-white px-3 py-1 rounded-full border border-amber-200">
                        進度: <span id="initialProgress">0/0</span>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-100 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">狀態</th>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">類別</th>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">名稱</th>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">主講/負責</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50" id="initialCourseList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 3: COURSES -->
        <div id="courses" class="tab-content space-y-6">
            <div id="scoredCourseSections" class="space-y-6"></div>
        </div>

        <!-- TAB 4: ADMIN -->
        <div id="admin" class="tab-content space-y-6">
            <div id="adminLogin" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 border border-gray-200 mt-10 text-center">
                <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-user-lock text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black text-gray-800">課程管理中心</h2>
                <p class="text-xs text-gray-400 mt-2">請驗證管理密鑰以繼續 (admin888)</p>
                <input type="password" id="adminPass" class="block w-full mt-6 rounded-xl border-gray-200 shadow-sm p-4 border bg-gray-50 text-center font-bold tracking-widest outline-none focus:ring-2 focus:ring-rose-500" placeholder="••••••••">
                <button onclick="loginAdmin()" class="w-full mt-4 bg-rose-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-rose-700 transition-all">解鎖後台管理</button>
            </div>

            <div id="adminPanel" class="hidden space-y-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">規畫對象切換</label>
                        <div class="flex items-center gap-4">
                            <select id="adminTargetType" onchange="toggleAdminScope()" class="bg-gray-100 border border-gray-200 rounded-lg px-4 py-2 font-bold outline-none focus:ring-2 focus:ring-rose-500 transition-all">
                                <option value="global">全域標竿計畫 (預設)</option>
                                <option value="custom">特定人員專屬規劃 (量身打造)</option>
                            </select>
                            <div id="targetUserIdContainer" class="hidden flex items-center gap-2">
                                <input type="text" id="targetSyncId" class="border border-gray-200 rounded-lg px-4 py-2 w-48 font-bold" placeholder="輸入識別碼">
                                <button onclick="loadConfigForAdmin(document.getElementById('targetSyncId').value)" class="bg-rose-100 text-rose-600 px-4 py-2 rounded-lg font-bold hover:bg-rose-200">讀取專屬計畫</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="saveAdminConfig()" id="btnPublish" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-emerald-700 flex items-center transition-all">
                            <i class="fas fa-cloud-upload-alt mr-2"></i>發布計畫變更
                        </button>
                        <button onclick="logoutAdmin()" class="bg-gray-100 text-gray-500 px-6 py-3 rounded-xl font-bold hover:bg-gray-200 transition-colors">退出管理</button>
                    </div>
                </div>

                <div id="adminListsContainer" class="grid grid-cols-1 gap-8"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 核心修復：正確的金鑰設定與環境辨識
        const ENV_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const firebaseConfig = ENV_CONFIG || {
            apiKey: "AIzaSyCvOqKFvnKXrj07BtfbLLTNZXiCw2jBgus",
            authDomain: "training-834e3.firebaseapp.com",
            projectId: "training-834e3",
            storageBucket: "training-834e3.firebasestorage.app",
            messagingSenderId: "284421517335",
            appId: "1:284421517335:web:19e2d463497126b8ccac52",
            measurementId: "G-TBK012JC7N"
        };
        const activeAppId = typeof __app_id !== 'undefined' ? __app_id : "element-training-v1-7-3";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const FALLBACK_PLAN = {
            initialCourses: [
                { id: 'i1', category: '管理部', name: '繳交個人資料', lecturer: '王淑英' },
                { id: 'i2', category: '管理部', name: '辦公室環境介紹', lecturer: '許鏸文' }
            ],
            courseData: [
                { id: 'c1', level: '新手篇', category: '核心', name: '正式入職自我介紹', points: 5, desc: '在 Line 群組完成自我介紹' }
            ]
        };

        let currentConfig = JSON.parse(JSON.stringify(FALLBACK_PLAN));
        let adminEditing = JSON.parse(JSON.stringify(FALLBACK_PLAN));
        let userState = { userInfo: { name: '', region: '', startDate: '' }, completedInitial: [], completedCourses: [] };

        let syncId = null;
        let unsubscribeSnap = null;
        let saveTimer = null;
        let isAdminActive = false;
        let authUser = null;

        // --- 啟動與連線核心 ---

        async function initSystem() {
            const timeoutGuard = setTimeout(() => {
                if (!document.getElementById('loadingOverlay').classList.contains('hidden')) {
                    document.getElementById('loadingCore').classList.add('hidden');
                    document.getElementById('loadingError').classList.remove('hidden');
                }
            }, 8000);

            try {
                document.getElementById('loadingStatus').innerText = "驗證資料庫權限...";
                
                // 核心修復：Auth FIRST with error fallback
                let tokenUsed = false;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                        tokenUsed = true;
                    } catch (e) { console.warn("Token mismatch, using anonymous."); }
                }
                
                if (!tokenUsed) await signInAnonymously(auth);

                onAuthStateChanged(auth, async (user) => {
                    authUser = user;
                    if (!user) return;

                    document.getElementById('loadingStatus').innerText = "下載最新訓練計畫...";
                    try {
                        const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', 'global');
                        const snap = await getDoc(docRef);
                        if (snap.exists()) {
                            currentConfig = snap.data();
                        } else {
                            await setDoc(docRef, FALLBACK_PLAN);
                        }

                        renderDisplay();
                        
                        const savedId = localStorage.getItem('rt_training_id');
                        if (savedId) {
                            document.getElementById('syncKey').value = savedId;
                            await applySync();
                        } else {
                            updateGlobalStats();
                        }

                        clearTimeout(timeoutGuard);
                        document.getElementById('loadingOverlay').classList.add('hidden');
                        setConnStatus('已同步雲端', 'text-green-600');
                    } catch (fsErr) {
                        console.error("Firestore Error:", fsErr);
                        document.getElementById('loadingStatus').innerText = "資料庫讀取受限，進入離線模式...";
                    }
                });
            } catch (err) {
                console.error("Critical Init Error:", err);
            }
        }

        window.skipLoading = () => document.getElementById('loadingOverlay').classList.add('hidden');

        // --- 使用者操作邏輯 ---

        window.applySync = async () => {
            const id = document.getElementById('syncKey').value.trim();
            if (!id || !authUser) return;
            
            if (unsubscribeSnap) unsubscribeSnap();
            syncId = id;
            localStorage.setItem('rt_training_id', id);
            setConnStatus('讀取個人化課程...', 'text-blue-600');

            try {
                const customRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', `user_${id}`);
                const globalRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', 'global');
                
                let snap = await getDoc(customRef);
                if (snap.exists()) {
                    currentConfig = snap.data();
                    document.getElementById('planTypeDisplay').innerText = "量身專屬計畫";
                } else {
                    const gSnap = await getDoc(globalRef);
                    currentConfig = gSnap.exists() ? gSnap.data() : FALLBACK_PLAN;
                    document.getElementById('planTypeDisplay').innerText = "全域標竿計畫";
                }

                renderDisplay();

                const recordRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'training_records', id);
                unsubscribeSnap = onSnapshot(recordRef, (s) => {
                    if (s.exists()) {
                        userState = s.data();
                        document.getElementById('userName').value = userState.userInfo.name || '';
                        document.getElementById('userRegion').value = userState.userInfo.region || '';
                        document.getElementById('startDate').value = userState.userInfo.startDate || '';
                    } else {
                        userState = { userInfo: { name: '', region: '', startDate: '' }, completedInitial: [], completedCourses: [] };
                    }
                    updateGlobalStats();
                    setConnStatus(`已與 ${id} 同步`, 'text-green-600');
                }, (err) => { setConnStatus('同步中斷', 'text-amber-600'); });
            } catch (err) { setConnStatus('同步失敗', 'text-rose-600'); }
        };

        window.debouncedSave = () => {
            userState.userInfo.name = document.getElementById('userName').value;
            userState.userInfo.region = document.getElementById('userRegion').value;
            userState.userInfo.startDate = document.getElementById('startDate').value;
            updateGlobalStats();
            
            if (!syncId || !authUser) return;
            setConnStatus('儲存中...', 'text-blue-500');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                try {
                    const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'training_records', syncId);
                    await setDoc(docRef, userState);
                    setConnStatus(`已同步 (${syncId})`, 'text-green-600');
                } catch (e) { console.error(e); }
            }, 1000);
        };

        window.resetData = async () => {
            if (!confirm("確定要重置目前的進度嗎？所有勾選的項目將被清除。")) return;
            userState = { userInfo: { name: '', region: '', startDate: '' }, completedInitial: [], completedCourses: [] };
            updateGlobalStats();
            if (syncId && authUser) {
                const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'training_records', syncId);
                await setDoc(docRef, userState);
            }
        };

        window.exportToExcel = () => {
            const wb = XLSX.utils.book_new();
            const dataRows = [
                ["元素組教育訓練進度報告"],
                ["姓名", userState.userInfo.name || "未填"],
                ["得分", document.getElementById('displayTotalScore').innerText],
                ["時間", new Date().toLocaleString()],
                [],
                ["階段", "課程項目", "完成狀態"]
            ];
            currentConfig.initialCourses.forEach(c => dataRows.push(["必修", c.name, userState.completedInitial.includes(c.id) ? "V" : ""]));
            currentConfig.courseData.forEach(c => dataRows.push([c.level, c.name, userState.completedCourses.includes(c.id) ? c.points : ""]));
            const ws = XLSX.utils.aoa_to_sheet(dataRows);
            XLSX.utils.book_append_sheet(wb, ws, "Progress");
            XLSX.writeFile(wb, `EducationReport_${userState.userInfo.name || 'User'}.xlsx`);
        };

        // --- 管理後台核心 ---

        window.loginAdmin = () => {
            if (document.getElementById('adminPass').value === 'admin888') {
                isAdminActive = true;
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadConfigForAdmin('global');
            } else { alert("金鑰錯誤，請洽詢管理員。"); }
        };

        window.logoutAdmin = () => {
            isAdminActive = false;
            document.getElementById('adminLogin').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminPass').value = '';
        };

        async function loadConfigForAdmin(tid) {
            if (!authUser) return;
            const docId = tid && tid !== 'global' ? `user_${tid}` : 'global';
            setConnStatus(`讀取計畫: ${docId}`, 'text-blue-500');
            try {
                const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', docId);
                const snap = await getDoc(docRef);
                adminEditing = snap.exists() ? snap.data() : JSON.parse(JSON.stringify(FALLBACK_PLAN));
                renderAdminEditor();
            } catch (err) { console.error(err); }
            finally { updateGlobalStats(); }
        }
        window.loadConfigForAdmin = loadConfigForAdmin;

        window.saveAdminConfig = async () => {
            if (!authUser) return alert("資料庫連線中...");
            const scope = document.getElementById('adminTargetType').value;
            const btn = document.getElementById('btnPublish');
            let docId = 'global';
            if (scope === 'custom') {
                const tid = document.getElementById('targetSyncId').value.trim();
                if (!tid) return alert("請輸入對象識別碼");
                docId = `user_${tid}`;
            }

            if (!confirm(`確定發布計畫至「${docId}」？這會即時生效。`)) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-sync animate-spin mr-2"></i>發布中...';
            
            try {
                const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', docId);
                const dataToSave = JSON.parse(JSON.stringify(adminEditing));
                await setDoc(docRef, dataToSave);
                alert("計畫發布成功！課程已在雲端更新。");
                if (syncId === (docId === 'global' ? syncId : docId.replace('user_', ''))) {
                    location.reload(); 
                }
            } catch (err) {
                console.error("Publishing Failed:", err);
                alert(`發布失敗: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-2"></i>發布計畫變更';
                updateGlobalStats();
            }
        };

        // --- 渲染引擎 ---

        function renderDisplay() {
            renderInitialList();
            renderScoredSections();
        }

        function renderInitialList() {
            document.getElementById('initialCourseList').innerHTML = currentConfig.initialCourses.map(c => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3">
                        <label class="custom-checkbox flex items-center cursor-pointer">
                            <input type="checkbox" class="hidden" data-id="${c.id}" onchange="toggleInitial('${c.id}')">
                            <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center transition-all"><svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                        </label>
                    </td>
                    <td class="px-4 py-3 text-[10px] text-gray-400 font-bold uppercase">${c.category}</td>
                    <td class="px-4 py-3 text-gray-900 font-bold">${c.name}</td>
                    <td class="px-4 py-3 text-xs text-gray-500">${c.lecturer || '-'}</td>
                </tr>
            `).join('');
            document.getElementById('initialPlanName').innerText = syncId ? `${syncId} 的訓練地圖` : "系統預設核心地圖";
        }

        function renderScoredSections() {
            const groups = ['新手篇', '理解篇', '規劃篇', '團隊合作篇', '自我成長'];
            document.getElementById('scoredCourseSections').innerHTML = groups.map(lv => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 bg-gray-50/50 flex justify-between items-center cursor-pointer hover:bg-gray-100" onclick="toggleSection('sec-${lv}')">
                        <h3 class="font-black text-gray-700 uppercase tracking-wide text-sm">${lv}</h3>
                        <i class="fas fa-chevron-down text-gray-300"></i>
                    </div>
                    <div id="sec-${lv}" class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-100 text-sm">
                            <tbody class="divide-y divide-gray-50">
                                ${currentConfig.courseData.filter(c => c.level === lv).map(c => `
                                    <tr class="hover:bg-blue-50/30">
                                        <td class="w-16 px-4 py-3 text-center">
                                            <label class="custom-checkbox inline-flex items-center cursor-pointer">
                                                <input type="checkbox" class="hidden" data-id="${c.id}" onchange="toggleCourse('${c.id}')">
                                                <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center transition-all"><svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                                            </label>
                                        </td>
                                        <td class="px-4 py-3 text-indigo-600 font-black text-xs w-32 uppercase">${c.brand || c.category}</td>
                                        <td class="px-4 py-3 text-gray-800 font-bold">${c.name}</td>
                                        <td class="px-4 py-3 font-black text-blue-600">${c.points}</td>
                                        <td class="px-4 py-3 text-xs text-gray-400 italic">${c.desc || ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `).join('');
        }

        function renderAdminEditor() {
            let html = `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 bg-amber-50 border-b border-amber-100 flex justify-between items-center">
                        <h3 class="font-black text-amber-900 uppercase">1. 編輯必修項目</h3>
                        <button onclick="adminAdd('i')" class="bg-amber-600 text-white px-3 py-1 rounded text-xs font-bold transition-all shadow-sm hover:bg-amber-700">+ 新增</button>
                    </div>
                    <div class="p-6 space-y-3">
                        ${adminEditing.initialCourses.map(c => `
                            <div class="grid grid-cols-1 md:grid-cols-6 gap-2 p-3 bg-gray-50 rounded-lg border border-gray-200">
                                <input type="text" value="${c.category}" oninput="adminUpdate('i', '${c.id}', 'category', this.value)" class="text-xs p-2 border rounded font-bold" placeholder="類別">
                                <input type="text" value="${c.name}" oninput="adminUpdate('i', '${c.id}', 'name', this.value)" class="col-span-3 text-xs p-2 border rounded font-bold" placeholder="項目名稱">
                                <input type="text" value="${c.lecturer || ''}" oninput="adminUpdate('i', '${c.id}', 'lecturer', this.value)" class="text-xs p-2 border rounded" placeholder="負責人">
                                <button onclick="adminDel('i', '${c.id}')" class="text-rose-500 hover:bg-rose-50 p-1 rounded transition-colors"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 bg-blue-50 border-b border-blue-100 flex justify-between items-center">
                        <h3 class="font-black text-blue-900 uppercase">2. 編輯評分項目</h3>
                        <button onclick="adminAdd('c')" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold transition-all shadow-sm hover:bg-blue-700">+ 新增</button>
                    </div>
                    <div class="p-6 space-y-3">
                        ${adminEditing.courseData.map(c => `
                            <div class="grid grid-cols-1 md:grid-cols-7 gap-2 p-3 bg-gray-50 rounded-lg border border-gray-200">
                                <select onchange="adminUpdate('c', '${c.id}', 'level', this.value)" class="text-[10px] p-2 border rounded font-bold outline-none">
                                    ${['新手篇','理解篇','規劃篇','團隊合作篇','自我成長'].map(l => `<option ${c.level === l ? 'selected' : ''}>${l}</option>`).join('')}
                                </select>
                                <input type="text" value="${c.brand || ''}" oninput="adminUpdate('c', '${c.id}', 'brand', this.value)" class="text-[10px] p-2 border rounded" placeholder="品牌">
                                <input type="text" value="${c.category}" oninput="adminUpdate('c', '${c.id}', 'category', this.value)" class="text-[10px] p-2 border rounded" placeholder="類別">
                                <input type="text" value="${c.name}" oninput="adminUpdate('c', '${c.id}', 'name', this.value)" class="col-span-2 text-[10px] p-2 border rounded font-bold" placeholder="項目">
                                <input type="number" value="${c.points}" oninput="adminUpdate('c', '${c.id}', 'points', this.value)" class="text-[10px] p-2 border rounded font-black text-blue-600" placeholder="分">
                                <button onclick="adminDel('c', '${c.id}')" class="text-rose-500 hover:bg-rose-50 p-1 rounded transition-colors"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('adminListsContainer').innerHTML = html;
        }

        // --- 輔助工具 ---

        window.adminAdd = (t) => {
            if (t === 'i') adminEditing.initialCourses.push({ id: 'i'+Date.now(), category: '管理', name: '新課程', lecturer: '' });
            else adminEditing.courseData.push({ id: 'c'+Date.now(), level: '新手篇', category: '一般', name: '新評分項', points: 1, desc: '' });
            renderAdminEditor();
        };
        window.adminDel = (t, id) => {
            if (t === 'i') adminEditing.initialCourses = adminEditing.initialCourses.filter(x => x.id !== id);
            else adminEditing.courseData = adminEditing.courseData.filter(x => x.id !== id);
            renderAdminEditor();
        };
        window.adminUpdate = (t, id, f, v) => {
            const list = t === 'i' ? adminEditing.initialCourses : adminEditing.courseData;
            const item = list.find(x => x.id === id);
            if (item) item[f] = f === 'points' ? (parseInt(v) || 0) : v;
        };

        window.toggleInitial = (id) => { if (userState.completedInitial.includes(id)) userState.completedInitial = userState.completedInitial.filter(x => x !== id); else userState.completedInitial.push(id); debouncedSave(); };
        window.toggleCourse = (id) => { if (userState.completedCourses.includes(id)) userState.completedCourses = userState.completedCourses.filter(x => x !== id); else userState.completedCourses.push(id); debouncedSave(); };
        window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
        window.toggleAdminScope = () => {
            const scope = document.getElementById('adminTargetType').value;
            document.getElementById('targetUserIdContainer').classList.toggle('hidden', scope !== 'custom');
            if (scope === 'global') loadConfigForAdmin('global');
        };

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            const btn = document.getElementById('btn-' + id);
            if(btn) btn.classList.add('active');
            if (id === 'admin' && isAdminActive) renderAdminEditor();
        };

        function updateGlobalStats() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                const id = cb.getAttribute('data-id');
                cb.checked = (userState.completedInitial || []).includes(id) || (userState.completedCourses || []).includes(id);
            });
            let total = 0, max = 0;
            const catStats = { '新手篇': {t:0, c:0}, '理解篇': {t:0, c:0}, '規劃篇': {t:0, c:0}, '團隊合作篇': {t:0, c:0}, '自我成長': {t:0, c:0} };
            const brandStats = {};
            currentConfig.courseData.forEach(c => {
                catStats[c.level].t += c.points; max += c.points;
                if ((userState.completedCourses || []).includes(c.id)) {
                    total += c.points; catStats[c.level].c += c.points;
                    if (c.brand) brandStats[c.brand] = (brandStats[c.brand] || 0) + 1;
                }
            });
            const iD = (userState.completedInitial || []).length, iT = currentConfig.initialCourses.length, iPct = iT === 0 ? 0 : Math.round((iD / iT) * 100);
            document.getElementById('displayTotalScore').innerText = total;
            document.getElementById('displayMaxScore').innerText = max;
            document.getElementById('displayScoreRatio').innerText = max === 0 ? '0%' : Math.round((total / max) * 100) + '%';
            
            const levels = [{level:0, min:0, next:15}, {level:1, min:15, next:65}, {level:2, min:65, next:180}, {level:3, min:180, next:350}, {level:4, min:350, next:430}, {level:5, min:430, next:null}];
            let current = levels[0]; for(let l of levels) { if(total >= l.min) current = l; else break; }
            document.getElementById('displayLevel').innerText = 'Lv ' + current.level;
            if (current.next) {
                document.getElementById('displayDistToUpgrade').innerText = current.next - total;
                document.getElementById('nextLevelName').innerText = 'Lv ' + (current.level + 1);
                document.getElementById('levelProgressBar').style.width = ((total - current.min) / (current.next - current.min) * 100) + '%';
            } else {
                document.getElementById('displayDistToUpgrade').innerText = 'MAX'; document.getElementById('nextLevelName').innerText = 'MAX'; document.getElementById('levelProgressBar').style.width = '100%';
            }

            document.getElementById('dashboardAnalysis').innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">計畫類別</th><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">得分</th><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">進度</th></tr></thead>
                        <tbody class="divide-y divide-gray-50">
                            <tr><td class="px-6 py-4 text-sm font-bold text-amber-700">必修核心</td><td class="px-6 py-4 text-sm font-bold">${iD}/${iT}</td><td class="px-6 py-4"><div class="w-12 h-1 bg-gray-100 rounded-full transition-all"><div class="h-full bg-amber-500" style="width: ${iPct}%"></div></div></td></tr>
                            ${Object.entries(catStats).map(([n, d]) => {
                                const p = d.t === 0 ? 0 : Math.round((d.c / d.t) * 100);
                                return `<tr><td class="px-6 py-4 text-sm font-bold text-gray-700">${n}</td><td class="px-6 py-4 text-sm font-bold">${d.c}/${d.t}</td><td class="px-6 py-4"><div class="w-12 h-1 bg-gray-100 rounded-full transition-all"><div class="h-full bg-blue-500" style="width: ${p}%"></div></div></td></tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">品牌</th><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">熟練堂數</th></tr></thead>
                        <tbody class="divide-y divide-gray-50">
                            ${Object.entries(brandStats).length === 0 ? '<tr><td colspan="2" class="px-6 py-4 text-xs text-gray-400 italic">尚無品牌進度數據</td></tr>' : Object.entries(brandStats).map(([n, c]) => `<tr><td class="px-6 py-4 text-sm font-bold text-gray-700">${n}</td><td class="px-6 py-4 text-sm font-black text-indigo-600">${c} 堂</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('initialProgress').innerText = `${iD}/${iT}`;
        }

        function setConnStatus(msg, colorClass) {
            const el = document.getElementById('syncStatus');
            el.innerHTML = `<i class="fas fa-check-circle mr-1"></i>${msg}`;
            el.className = `ml-4 px-2 py-1 rounded text-[10px] font-bold transition-all bg-white border border-gray-100 ${colorClass}`;
        }

        window.onload = initSystem;

    </script>
</body>
</html>
