<!DOCTYPE html>

</head>
<body class="text-gray-900">

        <!-- TAB 2: INITIAL -->

        <!-- TAB 4: ADMIN -->

                    <h2 class="text-2xl font-black text-gray-800">管理者登入</h2>

                </div>

            <div id="adminPanel" class="hidden space-y-8">

                                <option value="custom">特定人員專屬課程 (Tailored for User)</option>
                            </select>

                                <input type="text" id="targetSyncId" class="border border-gray-200 rounded-lg px-4 py-2 w-48 font-bold" placeholder="輸入人員識別碼">
                                <button onclick="loadCustomConfig()" class="bg-rose-100 text-rose-600 px-4 py-2 rounded-lg font-bold hover:bg-rose-200 transition-all">載入並編輯</button>
                            </div>

                    </div>
                    <div class="flex gap-2">
                        <button onclick="saveAdminConfig()" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-emerald-700 transition-all">

                        </button>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">

                        <button onclick="addInitialCourse()" class="bg-amber-600 text-white px-3 py-1 rounded text-sm font-bold shadow-sm hover:bg-amber-700">+ 新增</button>
                    </div>

                    </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 bg-blue-50 border-b border-blue-100 flex justify-between items-center">
                        <h3 class="font-black text-blue-900" id="adminScoredTitle">2. 編輯積分項目</h3>
                        <button onclick="addScoredCourse()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm font-bold shadow-sm hover:bg-blue-700">+ 新增</button>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Config
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "",
            authDomain: "training-834e3.firebaseapp.com",
            projectId: "training-834e3",
            storageBucket: "training-834e3.firebasestorage.app",
            messagingSenderId: "284421517335",
            appId: "1:284421517335:web:19e2d463497126b8ccac52"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : "element-training-fixed";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Defaults ---
        const fallbackConfig = {
            initialCourses: [
                { id: 'i1', category: '管理部課程', name: '繳交個人資料、填寫文件', time: '30 分鐘', lecturer: '王淑英', remark: '' },
                { id: 'i2', category: '管理部課程', name: '辦公室環境介紹', time: '20 分鐘', lecturer: '許鏸文', remark: '' }
            ],
            courseData: [
                { id: 'c1_1', level: '新手篇', category: '教育訓練', name: '正式入職自我介紹', points: 5, desc: '在 Line 群組完成自我介紹' }
            ]
        };

        let currentCourseConfig = JSON.parse(JSON.stringify(fallbackConfig)); // 目前使用的課程配置
        let adminEditingConfig = JSON.parse(JSON.stringify(fallbackConfig)); // 管理者正在編輯的配置
        
        let appState = {
            userInfo: { name: '', region: '', startDate: '' },
            completedInitial: [],
            completedCourses: []
        };

        let currentSyncId = null;
        let unsubscribeSync = null;
        let isAuthReady = false;
        let isAdmin = false;
        let saveTimeout = null;

        // --- Functions ---

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            const btn = document.getElementById('btn-' + id);
            if(btn) btn.classList.add('active');
            if (id === 'admin' && isAdmin) renderAdminEditor();
        };

        window.toggleAdminScope = () => {
            const scope = document.getElementById('adminTargetType').value;
            const container = document.getElementById('targetUserIdContainer');
            if (scope === 'custom') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
                // 切換回全域編輯時，重新載入全域資料
                loadGlobalConfigForAdmin();
            }
        };

        window.loginAdmin = () => {
            if (document.getElementById('adminPass').value === 'admin888') {
                isAdmin = true;
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadGlobalConfigForAdmin();
            } else {
                alert("金鑰錯誤");
            }
        };

        window.logoutAdmin = () => {
            isAdmin = false;
            document.getElementById('adminLogin').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminPass').value = '';
        };

        // 管理端：載入全域配置
        async function loadGlobalConfigForAdmin() {
            setSyncing(true, "讀取全域...");
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'global');
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                adminEditingConfig = snap.data();
            } else {
                adminEditingConfig = JSON.parse(JSON.stringify(fallbackConfig));
            }
            renderAdminEditor();
            setSyncing(false);
        }

        // 管理端：載入客製配置
        window.loadCustomConfig = async () => {
            const id = document.getElementById('targetSyncId').value.trim();
            if (!id) return alert("請輸入人員識別碼");
            
            setSyncing(true, `讀取 ${id}...`);
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', `user_${id}`);
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                adminEditingConfig = snap.data();
            } else {
                if (confirm(`找不到 ${id} 的專屬課程，是否以全域模板為基礎開始建立？`)) {
                    // 以全域為基礎，但準備儲存到人員路徑
                    const globalSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'global'));
                    adminEditingConfig = globalSnap.exists() ? globalSnap.data() : JSON.parse(JSON.stringify(fallbackConfig));
                }
            }
            renderAdminEditor();
            setSyncing(false);
        };

        // 管理端：儲存配置 (核心修復：嚴格路徑)
        window.saveAdminConfig = async () => {
            if (!auth.currentUser) return alert("資料庫連線中，請稍後");
            const scope = document.getElementById('adminTargetType').value;
            let docName = 'global';
            let confirmMsg = "確定發布全域預設課程變更？";

            if (scope === 'custom') {
                const targetId = document.getElementById('targetSyncId').value.trim();
                if (!targetId) return alert("請輸入人員識別碼");
                docName = `user_${targetId}`;
                confirmMsg = `確定發布 ${targetId} 的專屬課程？`;
            }

            if (!confirm(confirmMsg)) return;

            setSyncing(true, "寫入雲端...");
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', docName);
            try {
                await setDoc(docRef, adminEditingConfig);
                alert("變更發布成功！");
                // 如果目前登入的 syncKey 剛好是正在編輯的對象，則更新 UI
                if (currentSyncId === (docName === 'global' ? currentSyncId : docName.replace('user_', ''))) {
                    location.reload(); // 簡單起見直接重新整理載入最新計畫
                }
            } catch (err) {
                console.error("Save Error:", err);
                alert("發布失敗，請確認網路或權限。");
            } finally {
                setSyncing(false);
            }
        };

        // 使用者端：套用同步碼
        window.applySync = async () => {
            const id = document.getElementById('syncKey').value.trim();
            if (!id || !auth.currentUser) return;
            
            if (unsubscribeSync) unsubscribeSync();
            currentSyncId = id;
            localStorage.setItem('training_sync_v1_6_5', id);

            setSyncing(true, "同步中...");
            
            // 1. 載入課程計畫 (優先檢查客製 -> 再檢查全域)
            const customRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', `user_${id}`);
            const globalRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'global');
            
            const customSnap = await getDoc(customRef);
            if (customSnap.exists()) {
                currentCourseConfig = customSnap.data();
                document.getElementById('planTypeDisplay').innerText = `專屬量身計畫 (${id})`;
            } else {
                const globalSnap = await getDoc(globalRef);
                currentCourseConfig = globalSnap.exists() ? globalSnap.data() : JSON.parse(JSON.stringify(fallbackConfig));
                document.getElementById('planTypeDisplay').innerText = "全域標竿計畫";
            }

            renderInitialList();
            renderScoredSections();

            // 2. 監聽進度
            const recordRef = doc(db, 'artifacts', appId, 'public', 'data', 'training_records', id);
            unsubscribeSync = onSnapshot(recordRef, (snap) => {
                if (snap.exists()) {
                    appState = snap.data();
                    document.getElementById('userName').value = appState.userInfo.name || '';
                    document.getElementById('userRegion').value = appState.userInfo.region || '';
                    document.getElementById('startDate').value = appState.userInfo.startDate || '';
                } else {
                    appState = { userInfo: { name: '', region: '', startDate: '' }, completedInitial: [], completedCourses: [] };
                }
                updateAllUI();
                setSyncing(false);
            });
        };

        window.debouncedSave = () => {
            appState.userInfo.name = document.getElementById('userName').value;
            appState.userInfo.region = document.getElementById('userRegion').value;
            appState.userInfo.startDate = document.getElementById('startDate').value;
            updateAllUI();
            
            if (!currentSyncId || !auth.currentUser) return;

            setSyncing(true, "儲存進度...");
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'training_records', currentSyncId);
                try {
                    await setDoc(docRef, appState);
                    setSyncing(false);
                } catch (err) { console.error(err); }
            }, 1000);
        };

        // --- Admin UI Management ---
        window.addInitialCourse = () => {
            adminEditingConfig.initialCourses.push({ id: 'i' + Date.now(), category: '新類別', name: '新課程', time: '0m', lecturer: '講師', remark: '' });
            renderAdminEditor();
        };
        window.removeInitial = (id) => {
            adminEditingConfig.initialCourses = adminEditingConfig.initialCourses.filter(x => x.id !== id);
            renderAdminEditor();
        };
        window.addScoredCourse = () => {
            adminEditingConfig.courseData.push({ id: 'c' + Date.now(), level: '新手篇', category: '新類別', name: '新項目', points: 1, desc: '' });
            renderAdminEditor();
        };
        window.removeScored = (id) => {
            adminEditingConfig.courseData = adminEditingConfig.courseData.filter(x => x.id !== id);
            renderAdminEditor();
        };
        window.updateField = (type, id, field, val) => {
            const list = type === 'i' ? adminEditingConfig.initialCourses : adminEditingConfig.courseData;
            const item = list.find(x => x.id === id);
            if (item) item[field] = field === 'points' ? (parseInt(val) || 0) : val;
        };

        function renderAdminEditor() {
            document.getElementById('adminInitialList').innerHTML = adminEditingConfig.initialCourses.map(c => `
                <div class="grid grid-cols-1 md:grid-cols-6 gap-2 p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <input type="text" value="${c.category}" oninput="updateField('i', '${c.id}', 'category', this.value)" class="text-xs p-2 border rounded font-bold" placeholder="類別">
                    <input type="text" value="${c.name}" oninput="updateField('i', '${c.id}', 'name', this.value)" class="col-span-2 text-xs p-2 border rounded font-bold" placeholder="名稱">
                    <input type="text" value="${c.time}" oninput="updateField('i', '${c.id}', 'time', this.value)" class="text-xs p-2 border rounded" placeholder="時數">
                    <input type="text" value="${c.lecturer}" oninput="updateField('i', '${c.id}', 'lecturer', this.value)" class="text-xs p-2 border rounded" placeholder="講師">
                    <button onclick="removeInitial('${c.id}')" class="text-rose-500 hover:bg-rose-50 rounded"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');

            document.getElementById('adminScoredList').innerHTML = adminEditingConfig.courseData.map(c => `
                <div class="grid grid-cols-1 md:grid-cols-7 gap-2 p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <select onchange="updateField('c', '${c.id}', 'level', this.value)" class="text-[10px] p-2 border rounded font-bold">
                        <option ${c.level === '新手篇' ? 'selected' : ''}>新手篇</option>
                        <option ${c.level === '理解篇' ? 'selected' : ''}>理解篇</option>
                        <option ${c.level === '規劃篇' ? 'selected' : ''}>規劃篇</option>
                        <option ${c.level === '團隊合作篇' ? 'selected' : ''}>團隊合作篇</option>
                        <option ${c.level === '自我成長' ? 'selected' : ''}>自我成長</option>
                    </select>
                    <input type="text" value="${c.brand || ''}" oninput="updateField('c', '${c.id}', 'brand', this.value)" class="text-[10px] p-2 border rounded" placeholder="品牌">
                    <input type="text" value="${c.category}" oninput="updateField('c', '${c.id}', 'category', this.value)" class="text-[10px] p-2 border rounded" placeholder="類別">
                    <input type="text" value="${c.name}" oninput="updateField('c', '${c.id}', 'name', this.value)" class="col-span-2 text-[10px] p-2 border rounded font-bold" placeholder="名稱">
                    <input type="number" value="${c.points}" oninput="updateField('c', '${c.id}', 'points', this.value)" class="text-[10px] p-2 border rounded font-black text-blue-600" placeholder="分">
                    <button onclick="removeScored('${c.id}')" class="text-rose-500 hover:bg-rose-50 rounded"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        // --- Core User Logic ---
        window.toggleInitial = (id) => {
            if (appState.completedInitial.includes(id)) appState.completedInitial = appState.completedInitial.filter(x => x !== id);
            else appState.completedInitial.push(id);
            debouncedSave();
        };
        window.toggleCourse = (id) => {
            if (appState.completedCourses.includes(id)) appState.completedCourses = appState.completedCourses.filter(x => x !== id);
            else appState.completedCourses.push(id);
            debouncedSave();
        };
        window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');

        function renderInitialList() {
            document.getElementById('initialCourseList').innerHTML = currentCourseConfig.initialCourses.map(c => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3">
                        <label class="custom-checkbox flex items-center cursor-pointer">
                            <input type="checkbox" class="hidden" data-id="${c.id}" onchange="toggleInitial('${c.id}')">
                            <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center"><svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                        </label>
                    </td>
                    <td class="px-4 py-3 text-[10px] text-gray-400 font-bold">${c.category}</td>
                    <td class="px-4 py-3 text-gray-900 font-bold">${c.name}</td>
                    <td class="px-4 py-3 text-xs text-gray-500">${c.time}</td>
                    <td class="px-4 py-3 text-xs text-gray-500">${c.lecturer}</td>
                    <td class="px-4 py-3 text-[11px] text-gray-400 italic">${c.remark || ''}</td>
                </tr>
            `).join('');
            document.getElementById('initialPlanName').innerText = currentSyncId ? `${currentSyncId} 的必修項目` : "預設必修項目";
        }

        function renderScoredSections() {
            const levels = ['新手篇', '理解篇', '規劃篇', '團隊合作篇', '自我成長'];
            document.getElementById('scoredCourseSections').innerHTML = levels.map(lv => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 bg-gray-50/50 flex justify-between items-center cursor-pointer hover:bg-gray-100 transition-colors" onclick="toggleSection('sec-${lv}')">
                        <h3 class="font-black text-gray-700 uppercase tracking-wide text-sm">${lv}</h3>
                        <i class="fas fa-chevron-down text-gray-300"></i>
                    </div>
                    <div id="sec-${lv}" class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-100 text-sm">
                            <tbody class="divide-y divide-gray-50">
                                ${currentCourseConfig.courseData.filter(c => c.level === lv).map(c => `
                                    <tr class="hover:bg-blue-50/30 transition-colors">
                                        <td class="w-16 px-4 py-3 text-center">
                                            <label class="custom-checkbox inline-flex items-center cursor-pointer">
                                                <input type="checkbox" class="hidden" data-id="${c.id}" onchange="toggleCourse('${c.id}')">
                                                <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center"><svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                                            </label>
                                        </td>
                                        <td class="px-4 py-3 text-indigo-600 font-black text-xs w-32">${c.brand || c.category}</td>
                                        <td class="px-4 py-3 text-gray-800 font-bold">${c.name}</td>
                                        <td class="px-4 py-3 font-black text-blue-600">${c.points}</td>
                                        <td class="px-4 py-3 text-xs text-gray-400 italic">${c.desc || ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `).join('');
        }

        function updateAllUI() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                const id = cb.getAttribute('data-id');
                cb.checked = (appState.completedInitial || []).includes(id) || (appState.completedCourses || []).includes(id);
            });

            let total = 0, maxTotal = 0;
            const catStats = { '新手篇': {t:0, c:0}, '理解篇': {t:0, c:0}, '規劃篇': {t:0, c:0}, '團隊合作篇': {t:0, c:0}, '自我成長': {t:0, c:0} };
            const brandStats = {};
            
            currentCourseConfig.courseData.forEach(c => {
                catStats[c.level].t += c.points;
                maxTotal += c.points;
                if ((appState.completedCourses || []).includes(c.id)) {
                    total += c.points;
                    catStats[c.level].c += c.points;
                    if (c.brand) brandStats[c.brand] = (brandStats[c.brand] || 0) + 1;
                }
            });

            const iDone = (appState.completedInitial || []).length;
            const iTotal = currentCourseConfig.initialCourses.length;
            const iPct = iTotal === 0 ? 0 : Math.round((iDone / iTotal) * 100);

            document.getElementById('displayTotalScore').innerText = total;
            document.getElementById('displayMaxScore').innerText = maxTotal;
            document.getElementById('displayScoreRatio').innerText = maxTotal === 0 ? '0%' : Math.round((total / maxTotal) * 100) + '%';
            
            const levelThresholds = [
                { level: 0, min: 0, next: 15 }, { level: 1, min: 15, next: 65 },
                { level: 2, min: 65, next: 180 }, { level: 3, min: 180, next: 350 },
                { level: 4, min: 350, next: 430 }, { level: 5, min: 430, next: null }
            ];
            
            let curLv = levelThresholds[0];
            for(let l of levelThresholds) { if(total >= l.min) curLv = l; else break; }
            document.getElementById('displayLevel').innerText = 'Lv ' + curLv.level;
            
            if (curLv.next) {
                document.getElementById('displayDistToUpgrade').innerText = curLv.next - total;
                document.getElementById('nextLevelName').innerText = 'Lv ' + (curLv.level + 1);
                document.getElementById('levelProgressBar').style.width = ((total - curLv.min) / (curLv.next - curLv.min) * 100) + '%';
            } else {
                document.getElementById('displayDistToUpgrade').innerText = 'MAX';
                document.getElementById('nextLevelName').innerText = 'MAX';
                document.getElementById('levelProgressBar').style.width = '100%';
            }

            document.getElementById('courseAnalysisBody').innerHTML = `
                <tr class="bg-amber-50/50">
                    <td class="px-6 py-4 text-sm font-black text-amber-700">必修項目 (Mandatory)</td>
                    <td class="px-6 py-4 text-[10px] text-gray-400 font-bold uppercase">${iTotal} 項目</td>
                    <td class="px-6 py-4 text-sm font-black text-amber-600">${iDone}</td>
                    <td class="px-6 py-4"><div class="flex items-center space-x-2"><span class="text-xs font-bold text-gray-400">${iPct}%</span><div class="w-12 h-1 bg-gray-200 rounded-full"><div class="h-full bg-amber-500" style="width: ${iPct}%"></div></div></div></td>
                </tr>
            ` + Object.entries(catStats).map(([name, data]) => {
                const pct = data.t === 0 ? 0 : Math.round((data.c / data.t) * 100);
                return `<tr><td class="px-6 py-4 text-sm font-black text-gray-700">${name}</td><td class="px-6 py-4 text-[10px] text-gray-400 font-bold uppercase">${data.t} 分</td><td class="px-6 py-4 text-sm font-black text-blue-600">${data.c}</td><td class="px-6 py-4"><div class="flex items-center space-x-2"><span class="text-xs font-bold text-gray-400">${pct}%</span><div class="w-12 h-1 bg-gray-200 rounded-full"><div class="h-full bg-blue-500" style="width: ${pct}%"></div></div></div></td></tr>`;
            }).join('');

            const brandTargets = {};
            currentCourseConfig.courseData.forEach(c => { if(c.brand) brandTargets[c.brand] = (brandTargets[c.brand] || 0) + 1; });

            document.getElementById('brandAnalysisBody').innerHTML = Object.entries(brandTargets).map(([name, target]) => {
                const current = brandStats[name] || 0;
                const pct = target === 0 ? 0 : Math.round((current / target) * 100);
                return `<tr><td class="px-6 py-4 text-sm font-black text-gray-700">${name}</td><td class="px-6 py-4 text-[10px] text-gray-400 font-bold uppercase">${target}</td><td class="px-6 py-4 text-sm font-bold text-indigo-600">${current}</td><td class="px-6 py-4"><div class="w-full bg-gray-100 h-1.5 rounded-full"><div class="h-full bg-indigo-500" style="width: ${Math.min(100, pct)}%"></div></div></td></tr>`;
            }).join('');
            document.getElementById('initialProgress').innerText = `${iDone}/${iTotal}`;
        }

        function setSyncing(isSyncing, msg) {
            const el = document.getElementById('syncStatus');
            if (isSyncing) {
                el.innerHTML = `<i class="fas fa-sync animate-spin mr-1"></i>${msg}`;
                el.className = "ml-4 px-2 py-1 rounded text-[10px] font-bold bg-blue-100 text-blue-700";
            } else {
                el.innerHTML = `<i class="fas fa-check-circle mr-1"></i>連線中 (${currentSyncId || '未同步'})`;
                el.className = "ml-4 px-2 py-1 rounded text-[10px] font-bold bg-green-100 text-green-700";
            }
        }

        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                isAuthReady = true;

                // 初始載入全域配置
                const globalSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'global'));
                if (globalSnap.exists()) currentCourseConfig = globalSnap.data();

                renderInitialList();
                renderScoredSections();
                
                document.getElementById('loadingOverlay').classList.add('hidden');
                
                const savedId = localStorage.getItem('training_sync_v1_6_5');
                if (savedId) {
                    document.getElementById('syncKey').value = savedId;
                    await applySync();
                } else {
                    updateAllUI();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loadingOverlay').innerHTML = `<p class='text-red-500 font-bold'>資料庫初始失敗</p>`;
            }
        }

        window.onload = initApp;

    </script>
</body>
</html>
