<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素組教育訓練系統 v1.7.8 (Leveling Logic Fixed)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        
        .custom-checkbox input:checked + div {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .custom-checkbox input:checked + div svg {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        input:disabled, select:disabled {
            background-color: #f1f5f9 !important;
            cursor: not-allowed;
            color: #64748b !important;
            opacity: 1;
        }
    </style>
</head>
<body class="text-gray-900">

    <!-- 加載遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center p-6 text-center">
        <div id="loadingCore">
            <div class="spinner mb-4 mx-auto"></div>
            <p class="text-gray-500 animate-pulse font-bold text-lg">系統安全檢查中...</p>
            <p id="loadingStatus" class="text-gray-400 text-xs mt-2">正在建立雲端安全連線...</p>
        </div>
        <div id="loadingError" class="hidden max-w-sm">
            <i class="fas fa-wifi-slash text-rose-500 text-5xl mb-4"></i>
            <h3 class="font-bold text-gray-800 text-xl">連線逾時</h3>
            <p class="text-gray-500 text-sm mt-2 mb-6">無法與雲端資料庫取得連線。請檢查網路或重新整理頁面。</p>
            <div class="flex flex-col gap-2">
                <button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all">重新嘗試連線</button>
                <button onclick="skipLoading()" class="bg-gray-100 text-gray-500 px-6 py-3 rounded-xl font-bold hover:bg-gray-200 transition-all">進入離線預覽模式</button>
            </div>
        </div>
    </div>

    <!-- 頂部導航列 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-black bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                        <i class="fas fa-graduation-cap mr-2"></i>教育訓練系統 v1.7.8
                    </span>
                    <span id="syncStatus" class="ml-4 px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-100 text-gray-400 transition-all">
                        <i class="fas fa-circle-notch animate-spin mr-1"></i>連線中
                    </span>
                </div>
                <div class="flex items-center space-x-1 md:space-x-2">
                    <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn active px-3 py-2 rounded-md text-sm font-medium border border-transparent transition-all">儀表板</button>
                    <button onclick="switchTab('initial')" id="btn-initial" class="nav-btn px-3 py-2 rounded-md text-sm font-medium border border-transparent transition-all">必修</button>
                    <button onclick="switchTab('courses')" id="btn-courses" class="nav-btn px-3 py-2 rounded-md text-sm font-medium border border-transparent transition-all">評分</button>
                    <button onclick="switchTab('admin')" id="btn-admin" class="nav-btn px-3 py-2 rounded-md text-sm font-medium border border-rose-200 text-rose-600 hover:bg-rose-50 transition-all"><i class="fas fa-user-shield mr-1"></i>管理端</button>
                    <button onclick="exportToExcel()" title="匯出 Excel" class="hidden md:block text-emerald-600 px-2 hover:bg-emerald-50 rounded transition-colors"><i class="fas fa-file-excel"></i></button>
                    <button id="btnNavReset" onclick="resetData()" title="重置個人進度" class="hidden text-rose-600 px-2 hover:bg-rose-50 rounded transition-colors"><i class="fas fa-redo-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">

        <!-- TAB 1: DASHBOARD -->
        <div id="dashboard" class="tab-content active space-y-6">
            <div class="bg-indigo-600 rounded-xl shadow-lg p-6 text-white border-b-4 border-indigo-800 transition-all">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-lg font-bold"><i class="fas fa-id-badge mr-2"></i>個人識別碼數據同步</h2>
                        <p class="text-xs opacity-70 mt-1 text-indigo-100">輸入專屬識別碼以載入訓練進度。個人基本資訊與計畫配置僅限管理員修改。</p>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="syncKey" class="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-white/50 w-full md:w-64 font-bold" placeholder="輸入 ID">
                        <button onclick="applySync()" class="bg-white text-indigo-600 px-6 py-2 rounded-lg font-bold hover:bg-indigo-50 transition-all shadow-md">連線同步</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 relative">
                <div id="adminBadge" class="hidden absolute top-4 right-4 bg-rose-100 text-rose-600 text-[10px] font-bold px-2 py-1 rounded uppercase animate-pulse">
                    <i class="fas fa-unlock mr-1"></i> 管理者編輯權限已解鎖
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">姓名 (唯讀)</label>
                        <input type="text" id="userName" oninput="debouncedSave()" disabled class="block w-full rounded-lg border-gray-200 shadow-sm sm:text-sm border p-2.5 bg-gray-50 font-bold" placeholder="需由管理者編輯">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">區域 (唯讀)</label>
                        <select id="userRegion" onchange="debouncedSave()" disabled class="block w-full rounded-lg border-gray-200 shadow-sm sm:text-sm border p-2.5 bg-gray-50 font-bold">
                            <option value="">尚未選取</option>
                            <option value="北區">北區</option>
                            <option value="中區">中區</option>
                            <option value="南區">南區</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">到職日 (唯讀)</label>
                        <input type="date" id="startDate" oninput="debouncedSave()" disabled class="block w-full rounded-lg border-gray-200 shadow-sm sm:text-sm border p-2.5 bg-gray-50 font-bold">
                    </div>
                    <div class="flex flex-col justify-center items-center md:items-end">
                        <div id="displayLevel" class="text-5xl font-black text-blue-600 italic">Lv 1</div>
                        <div class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest font-bold">Training Rank</div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white border-l-8 border-blue-600 rounded-xl shadow-sm p-6">
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">目前累計總積分</div>
                    <div class="text-4xl font-black mt-1 text-gray-800" id="displayTotalScore">0</div>
                    <div class="mt-4 text-xs font-bold text-blue-600 bg-blue-50 inline-block px-2 py-1 rounded">達成率: <span id="displayScoreRatio">0%</span></div>
                </div>
                <div class="bg-white border-l-8 border-amber-500 rounded-xl shadow-sm p-6 flex flex-col justify-between">
                    <div>
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">下個等級: <span id="nextLevelName" class="text-amber-600">--</span></div>
                        <div class="flex items-baseline">
                            <span class="text-4xl font-black text-gray-800" id="displayDistToUpgrade">--</span>
                            <span class="ml-2 text-gray-400 text-xs italic">pts left</span>
                        </div>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-2 mt-4 overflow-hidden">
                        <div class="bg-amber-500 h-2 rounded-full transition-all duration-1000" id="levelProgressBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="bg-white border-l-8 border-emerald-500 rounded-xl shadow-sm p-6">
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">計畫型態</div>
                    <div class="text-2xl font-black text-gray-800 mt-2" id="planTypeDisplay">正在連線...</div>
                    <div class="mt-3 flex items-center text-[10px] text-emerald-600 font-bold italic">
                        <i class="fas fa-bullseye mr-1"></i> 計畫滿分: <span id="displayMaxScore" class="ml-1">0</span> pts
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="dashboardAnalysis"></div>
        </div>

        <!-- TAB 2: INITIAL (必修) -->
        <div id="initial" class="tab-content space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-100 bg-amber-50 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-amber-900 text-lg">必修核心計畫</h3>
                        <p class="text-xs text-amber-700 mt-1" id="initialPlanName">載入中...</p>
                    </div>
                    <div class="text-xs font-bold text-amber-800 bg-white px-3 py-1 rounded-full border border-amber-200 shadow-sm">
                        完成項目: <span id="initialProgress">0/0</span>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-100 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">狀態</th>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">類別</th>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">名稱</th>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400 uppercase">講師/負責</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50" id="initialCourseList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 3: COURSES (評分) -->
        <div id="courses" class="tab-content space-y-6">
            <div id="scoredCourseSections" class="space-y-6"></div>
        </div>

        <!-- TAB 4: ADMIN (管理) -->
        <div id="admin" class="tab-content space-y-6">
            <div id="adminLogin" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 border border-gray-200 mt-10 text-center">
                <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-lock text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black text-gray-800">管理者驗證門檻</h2>
                <p class="text-xs text-gray-400 mt-2">請輸入後台權限金鑰 (預設: admin888)</p>
                <input type="password" id="adminPass" class="block w-full mt-6 rounded-xl border-gray-200 shadow-sm p-4 border bg-gray-50 text-center font-bold tracking-widest outline-none focus:ring-2 focus:ring-rose-500 transition-all" placeholder="••••••••">
                <button onclick="loginAdmin()" class="w-full mt-4 bg-rose-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-rose-700 transition-all">進入後台模式</button>
            </div>

            <div id="adminPanel" class="hidden space-y-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col md:flex-row md:items-center justify-between gap-6 transition-all">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-tighter">規畫配置模式</label>
                        <div class="flex items-center gap-4">
                            <select id="adminTargetType" onchange="toggleAdminScope()" class="bg-gray-100 border border-gray-200 rounded-lg px-4 py-2 font-bold outline-none focus:ring-2 focus:ring-rose-500 transition-all text-sm">
                                <option value="global">全域標竿計畫 (系統預設)</option>
                                <option value="custom">特定人員專屬規劃 (個人量身)</option>
                            </select>
                            <div id="targetUserIdContainer" class="hidden flex items-center gap-2">
                                <input type="text" id="targetSyncId" class="border border-gray-200 rounded-lg px-4 py-2 w-48 font-bold text-sm" placeholder="輸入同步 ID">
                                <button onclick="loadConfigForAdmin(document.getElementById('targetSyncId').value)" class="bg-rose-100 text-rose-600 px-4 py-2 rounded-lg font-bold hover:bg-rose-200 transition-colors text-sm">載入計畫</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="saveAdminConfig()" id="btnPublish" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-emerald-700 flex items-center transition-all">
                            <i class="fas fa-cloud-upload-alt mr-2"></i>發布所有變更
                        </button>
                        <button onclick="logoutAdmin()" class="bg-gray-100 text-gray-500 px-6 py-3 rounded-xl font-bold hover:bg-gray-200 transition-colors">結束管理</button>
                    </div>
                </div>

                <div id="adminListsContainer" class="grid grid-cols-1 gap-8"></div>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 核心配置：與截圖中提供的信息一致
        const firebaseConfig = {
            apiKey: "AIzaSyCvOqKFvnKXrj07BtfbLLTNZXiCw2jBgus",
            authDomain: "training-834e3.firebaseapp.com",
            projectId: "training-834e3",
            storageBucket: "training-834e3.firebasestorage.app",
            messagingSenderId: "284421517335",
            appId: "1:284421517335:web:19e2d463497126b8ccac52",
            measurementId: "G-TBK012JC7N"
        };
        const activeAppId = typeof __app_id !== 'undefined' ? __app_id : "element-training-v1-7-8";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const FALLBACK_PLAN = {
            initialCourses: [
                { id: 'i1', category: '管理部', name: '繳交入職資料', lecturer: '王淑英' },
                { id: 'i2', category: '管理部', name: '辦公環境導覽', lecturer: '許鏸文' }
            ],
            courseData: [
                { id: 'c1', level: '新手篇', category: '核心', name: '首日新人自我介紹', points: 10, lecturer: '管理部', remark: '需在 Line 團隊群組完成' }
            ]
        };

        let currentConfig = JSON.parse(JSON.stringify(FALLBACK_PLAN));
        let adminEditing = JSON.parse(JSON.stringify(FALLBACK_PLAN));
        let userState = { userInfo: { name: '', region: '', startDate: '' }, completedInitial: [], completedCourses: [] };

        let syncId = null;
        let unsubscribeSnap = null;
        let saveTimer = null;
        let isAdminActive = false;
        let authUser = null;

        // --- 核心啟動 ---

        async function init() {
            const timeoutGuard = setTimeout(() => {
                if (!document.getElementById('loadingOverlay').classList.contains('hidden')) {
                    document.getElementById('loadingCore').classList.add('hidden');
                    document.getElementById('loadingError').classList.remove('hidden');
                }
            }, 8000);

            try {
                document.getElementById('loadingStatus').innerText = "驗證資料庫權限...";
                
                let tokenUsed = false;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                        tokenUsed = true;
                    } catch (e) { console.warn("Token mismatch, using anonymous."); }
                }
                
                if (!tokenUsed) await signInAnonymously(auth);

                onAuthStateChanged(auth, async (user) => {
                    authUser = user;
                    if (!user) return;

                    document.getElementById('loadingStatus').innerText = "獲取雲端計畫中...";
                    try {
                        const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', 'global');
                        const snap = await getDoc(docRef);
                        if (snap.exists()) {
                            currentConfig = snap.data();
                        } else {
                            await setDoc(docRef, FALLBACK_PLAN);
                        }

                        renderAllDisplay();
                        
                        const savedId = localStorage.getItem('rt_training_id');
                        if (savedId) {
                            document.getElementById('syncKey').value = savedId;
                            await applySync();
                        } else {
                            updateGlobalStats();
                        }

                        clearTimeout(timeoutGuard);
                        document.getElementById('loadingOverlay').classList.add('hidden');
                        setConnStatus('雲端已就緒', 'text-green-600');
                    } catch (fsErr) {
                        console.error("Firestore Error:", fsErr);
                        document.getElementById('loadingStatus').innerText = "連線成功但讀取權限受限...";
                    }
                });
            } catch (err) {
                console.error("初始化失敗:", err);
            }
        }

        window.skipLoading = () => document.getElementById('loadingOverlay').classList.add('hidden');

        // --- 管理權限控制 ---

        window.loginAdmin = () => {
            if (document.getElementById('adminPass').value === 'admin888') {
                isAdminActive = true;
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                
                setInfoFieldsLocked(false);
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('btnNavReset').classList.remove('hidden');
                
                loadConfigForAdmin('global');
            } else { alert("金鑰驗證失敗。"); }
        };

        window.logoutAdmin = () => {
            isAdminActive = false;
            document.getElementById('adminLogin').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminPass').value = '';
            
            setInfoFieldsLocked(true);
            document.getElementById('adminBadge').classList.add('hidden');
            document.getElementById('btnNavReset').classList.add('hidden');
        };

        function setInfoFieldsLocked(isLocked) {
            ['userName', 'userRegion', 'startDate'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.disabled = isLocked;
            });
        }

        async function loadConfigForAdmin(tid) {
            if (!authUser) return;
            const docId = tid && tid !== 'global' ? `user_${tid}` : 'global';
            setConnStatus(`讀取計畫: ${docId}`, 'text-blue-500');
            try {
                const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', docId);
                const snap = await getDoc(docRef);
                adminEditing = snap.exists() ? snap.data() : JSON.parse(JSON.stringify(FALLBACK_PLAN));
                renderAdminEditor();
            } catch (err) { console.error(err); }
            finally { updateGlobalStats(); }
        }
        window.loadConfigForAdmin = loadConfigForAdmin;

        window.saveAdminConfig = async () => {
            if (!authUser) return alert("資料庫未就緒");
            const scope = document.getElementById('adminTargetType').value;
            const btn = document.getElementById('btnPublish');
            let docId = 'global';
            if (scope === 'custom') {
                const tid = document.getElementById('targetSyncId').value.trim();
                if (!tid) return alert("請輸入對象 ID");
                docId = `user_${tid}`;
            }

            if (!confirm(`確定發布變更至「${docId}」？這將影響所有相關使用者。`)) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-sync animate-spin mr-2"></i>發布中...';
            
            try {
                const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', docId);
                const dataToSave = JSON.parse(JSON.stringify(adminEditing));
                await setDoc(docRef, dataToSave);
                alert("計畫變更已發布！");
                if (syncId === (docId === 'global' ? syncId : docId.replace('user_', ''))) {
                    location.reload(); 
                }
            } catch (err) {
                console.error("Publish Error:", err);
                alert(`發布失敗: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-2"></i>發布計畫變更';
                updateGlobalStats();
            }
        };

        // --- 資料同步處理 ---

        window.applySync = async () => {
            const id = document.getElementById('syncKey').value.trim();
            if (!id || !authUser) return;
            
            if (unsubscribeSnap) unsubscribeSnap();
            syncId = id;
            localStorage.setItem('rt_training_id', id);
            setConnStatus('正在同步個人配置...', 'text-blue-600');

            try {
                const customRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', `user_${id}`);
                const globalRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'configs', 'global');
                
                let snap = await getDoc(customRef);
                if (snap.exists()) {
                    currentConfig = snap.data();
                    document.getElementById('planTypeDisplay').innerText = "量身專屬計畫";
                } else {
                    const gSnap = await getDoc(globalRef);
                    currentConfig = gSnap.exists() ? gSnap.data() : FALLBACK_PLAN;
                    document.getElementById('planTypeDisplay').innerText = "全域標竿計畫";
                }

                renderAllDisplay();

                const recordRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'training_records', id);
                unsubscribeSnap = onSnapshot(recordRef, (s) => {
                    if (s.exists()) {
                        userState = s.data();
                        document.getElementById('userName').value = userState.userInfo.name || '';
                        document.getElementById('userRegion').value = userState.userInfo.region || '';
                        document.getElementById('startDate').value = userState.userInfo.startDate || '';
                    } else {
                        userState = { userInfo: { name: '', region: '', startDate: '' }, completedInitial: [], completedCourses: [] };
                    }
                    updateGlobalStats();
                    setConnStatus(`已同步 (${id})`, 'text-green-600');
                }, (err) => { setConnStatus('連線不穩定', 'text-amber-600'); });
            } catch (err) { setConnStatus('同步異常', 'text-rose-600'); }
        };

        window.debouncedSave = () => {
            userState.userInfo.name = document.getElementById('userName').value;
            userState.userInfo.region = document.getElementById('userRegion').value;
            userState.userInfo.startDate = document.getElementById('startDate').value;
            updateGlobalStats();
            
            if (!syncId || !authUser) return;
            setConnStatus('雲端存儲中...', 'text-blue-500');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                try {
                    const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'training_records', syncId);
                    await setDoc(docRef, userState);
                    setConnStatus(`進度已更新 (${syncId})`, 'text-green-600');
                } catch (e) { console.error(e); }
            }, 1000);
        };

        window.resetData = async () => {
            if (!confirm("管理者確定：要清空此人員的所有完成紀錄嗎？")) return;
            userState.completedInitial = [];
            userState.completedCourses = [];
            updateGlobalStats();
            if (syncId && authUser) {
                const docRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'training_records', syncId);
                await setDoc(docRef, userState);
                alert("進度已清空。");
            }
        };

        window.exportToExcel = () => {
            const wb = XLSX.utils.book_new();
            const dataRows = [
                ["訓練成果報告 - 元素組"],
                ["姓名", userState.userInfo.name || "未填"],
                ["累計積分", document.getElementById('displayTotalScore').innerText],
                ["目前等級", document.getElementById('displayLevel').innerText],
                ["統計時間", new Date().toLocaleString()],
                [],
                ["類別", "項目名稱", "講師", "狀態/得分"]
            ];
            currentConfig.initialCourses.forEach(c => dataRows.push(["核心必修", c.name, c.lecturer || "-", userState.completedInitial.includes(c.id) ? "完成" : "-"]));
            currentConfig.courseData.forEach(c => dataRows.push([c.level, c.name, c.lecturer || "-", userState.completedCourses.includes(c.id) ? `${c.points}分` : "-"]));
            const ws = XLSX.utils.aoa_to_sheet(dataRows);
            XLSX.utils.book_append_sheet(wb, ws, "Progress");
            XLSX.writeFile(wb, `EducationReport_${userState.userInfo.name || 'User'}.xlsx`);
        };

        // --- 渲染功能 ---

        function renderAllDisplay() {
            renderInitialList();
            renderScoredSections();
        }

        function renderInitialList() {
            document.getElementById('initialCourseList').innerHTML = currentConfig.initialCourses.map(c => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3">
                        <label class="custom-checkbox flex items-center cursor-pointer">
                            <input type="checkbox" class="hidden" data-id="${c.id}" onchange="toggleInitial('${c.id}')">
                            <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center transition-all"><svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                        </label>
                    </td>
                    <td class="px-4 py-3 text-[10px] text-gray-400 font-bold uppercase tracking-tighter">${c.category}</td>
                    <td class="px-4 py-3 text-gray-900 font-bold">${c.name}</td>
                    <td class="px-4 py-3 text-xs text-gray-500">${c.lecturer || '-'}</td>
                </tr>
            `).join('');
            document.getElementById('initialPlanName').innerText = syncId ? `${syncId} 的個人必修計畫` : "標準核心計畫清單";
        }

        function renderScoredSections() {
            const groups = ['新手篇', '理解篇', '規劃篇', '團隊合作篇', '自我成長'];
            document.getElementById('scoredCourseSections').innerHTML = groups.map(lv => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 bg-gray-50/50 flex justify-between items-center cursor-pointer hover:bg-gray-100 transition-all" onclick="toggleSection('sec-${lv}')">
                        <h3 class="font-black text-gray-700 uppercase tracking-wide text-sm">${lv}</h3>
                        <i class="fas fa-chevron-down text-gray-300"></i>
                    </div>
                    <div id="sec-${lv}" class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-100 text-sm">
                            <thead class="bg-gray-50/50">
                                <tr class="text-[10px] text-gray-400 font-bold uppercase">
                                    <th class="px-4 py-2 text-center w-16">狀態</th>
                                    <th class="px-4 py-2 text-left w-32">品牌/類別</th>
                                    <th class="px-4 py-2 text-left">名稱</th>
                                    <th class="px-4 py-2 text-left w-24">分值</th>
                                    <th class="px-4 py-2 text-left w-32">講師</th>
                                    <th class="px-4 py-2 text-left">備註</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-50">
                                ${currentConfig.courseData.filter(c => c.level === lv).map(c => `
                                    <tr class="hover:bg-blue-50/30">
                                        <td class="px-4 py-3 text-center">
                                            <label class="custom-checkbox inline-flex items-center cursor-pointer">
                                                <input type="checkbox" class="hidden" data-id="${c.id}" onchange="toggleCourse('${c.id}')">
                                                <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center transition-all"><svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                                            </label>
                                        </td>
                                        <td class="px-4 py-3 text-indigo-600 font-black text-xs uppercase tracking-tighter">${c.brand || c.category}</td>
                                        <td class="px-4 py-3 text-gray-800 font-bold">${c.name}</td>
                                        <td class="px-4 py-3 font-black text-blue-600">${c.points} pts</td>
                                        <td class="px-4 py-3 text-xs text-gray-500 font-bold">${c.lecturer || '-'}</td>
                                        <td class="px-4 py-3 text-xs text-gray-400 italic">${c.remark || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `).join('');
        }

        function renderAdminEditor() {
            let html = `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden shadow-inner">
                    <div class="px-6 py-4 bg-amber-50 border-b border-amber-100 flex justify-between items-center">
                        <h3 class="font-black text-amber-900 uppercase text-sm">1. 核心必修計畫規劃</h3>
                        <button onclick="adminAdd('i')" class="bg-amber-600 text-white px-3 py-1 rounded text-xs font-bold transition-all shadow-sm hover:bg-amber-700">+ 新增必修</button>
                    </div>
                    <div class="p-6 space-y-3">
                        ${adminEditing.initialCourses.map(c => `
                            <div class="grid grid-cols-1 md:grid-cols-6 gap-2 p-3 bg-gray-50 rounded-lg border border-gray-200">
                                <input type="text" value="${c.category}" oninput="adminUpdate('i', '${c.id}', 'category', this.value)" class="text-xs p-2 border rounded font-bold" placeholder="類別">
                                <input type="text" value="${c.name}" oninput="adminUpdate('i', '${c.id}', 'name', this.value)" class="col-span-3 text-xs p-2 border rounded font-bold" placeholder="項目名稱">
                                <input type="text" value="${c.lecturer || ''}" oninput="adminUpdate('i', '${c.id}', 'lecturer', this.value)" class="text-xs p-2 border rounded" placeholder="負責人">
                                <button onclick="adminDel('i', '${c.id}')" class="text-rose-500 hover:bg-rose-50 p-1 rounded transition-colors"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mt-6">
                    <div class="px-6 py-4 bg-blue-50 border-b border-blue-100 flex justify-between items-center">
                        <h3 class="font-black text-blue-900 uppercase text-sm">2. 積分與指標課程規劃 (含講師與備註)</h3>
                        <button onclick="adminAdd('c')" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold transition-all shadow-sm hover:bg-blue-700">+ 新增指標項</button>
                    </div>
                    <div class="p-6 space-y-4">
                        ${adminEditing.courseData.map(c => `
                            <div class="bg-white border rounded-lg p-4 space-y-3 border-gray-100 shadow-sm hover:border-blue-200 transition-all">
                                <div class="grid grid-cols-1 md:grid-cols-7 gap-2">
                                    <select onchange="adminUpdate('c', '${c.id}', 'level', this.value)" class="text-[10px] p-2 border rounded font-bold outline-none col-span-1">
                                        ${['新手篇','理解篇','規劃篇','團隊合作篇','自我成長'].map(l => `<option ${c.level === l ? 'selected' : ''}>${l}</option>`).join('')}
                                    </select>
                                    <input type="text" value="${c.brand || ''}" oninput="adminUpdate('c', '${c.id}', 'brand', this.value)" class="text-[10px] p-2 border rounded col-span-1" placeholder="品牌">
                                    <input type="text" value="${c.category}" oninput="adminUpdate('c', '${c.id}', 'category', this.value)" class="text-[10px] p-2 border rounded col-span-1" placeholder="類別">
                                    <input type="text" value="${c.name}" oninput="adminUpdate('c', '${c.id}', 'name', this.value)" class="col-span-2 text-[10px] p-2 border rounded font-bold" placeholder="課程名稱">
                                    <input type="number" value="${c.points}" oninput="adminUpdate('c', '${c.id}', 'points', this.value)" class="text-[10px] p-2 border rounded font-black text-blue-600 col-span-1" placeholder="分數">
                                    <button onclick="adminDel('c', '${c.id}')" class="text-rose-500 hover:bg-rose-50 p-1 rounded transition-colors text-center col-span-1"><i class="fas fa-trash-alt"></i></button>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-dashed border-gray-100 pt-3">
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] text-gray-400 font-bold whitespace-nowrap uppercase">講師：</span>
                                        <input type="text" value="${c.lecturer || ''}" oninput="adminUpdate('c', '${c.id}', 'lecturer', this.value)" class="text-xs p-2 border rounded w-full font-bold text-indigo-600" placeholder="編輯講師">
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] text-gray-400 font-bold whitespace-nowrap uppercase">備註：</span>
                                        <input type="text" value="${c.remark || ''}" oninput="adminUpdate('c', '${c.id}', 'remark', this.value)" class="text-xs p-2 border rounded w-full italic text-gray-500" placeholder="編輯考核備註">
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('adminListsContainer').innerHTML = html;
        }

        // --- 輔助工具 ---

        window.adminAdd = (t) => {
            if (t === 'i') adminEditing.initialCourses.push({ id: 'i'+Date.now(), category: '管理', name: '新課程', lecturer: '' });
            else adminEditing.courseData.push({ id: 'c'+Date.now(), level: '新手篇', category: '一般', name: '新評分項', points: 1, lecturer: '', remark: '' });
            renderAdminEditor();
        };
        window.adminDel = (t, id) => {
            if (t === 'i') adminEditing.initialCourses = adminEditing.initialCourses.filter(x => x.id !== id);
            else adminEditing.courseData = adminEditing.courseData.filter(x => x.id !== id);
            renderAdminEditor();
        };
        window.adminUpdate = (t, id, f, v) => {
            const list = t === 'i' ? adminEditing.initialCourses : adminEditing.courseData;
            const item = list.find(x => x.id === id);
            if (item) item[f] = f === 'points' ? (parseInt(v) || 0) : v;
        };

        window.toggleInitial = (id) => { if (userState.completedInitial.includes(id)) userState.completedInitial = userState.completedInitial.filter(x => x !== id); else userState.completedInitial.push(id); debouncedSave(); };
        window.toggleCourse = (id) => { if (userState.completedCourses.includes(id)) userState.completedCourses = userState.completedCourses.filter(x => x !== id); else userState.completedCourses.push(id); debouncedSave(); };
        window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
        window.toggleAdminScope = () => {
            const scope = document.getElementById('adminTargetType').value;
            document.getElementById('targetUserIdContainer').classList.toggle('hidden', scope !== 'custom');
            if (scope === 'global') loadConfigForAdmin('global');
        };

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            const btn = document.getElementById('btn-' + id);
            if(btn) btn.classList.add('active');
            if (id === 'admin' && isAdminActive) renderAdminEditor();
        };

        function updateGlobalStats() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                const id = cb.getAttribute('data-id');
                cb.checked = (userState.completedInitial || []).includes(id) || (userState.completedCourses || []).includes(id);
            });
            let total = 0, max = 0;
            const catStats = { '新手篇': {t:0, c:0}, '理解篇': {t:0, c:0}, '規劃篇': {t:0, c:0}, '團隊合作篇': {t:0, c:0}, '自我成長': {t:0, c:0} };
            const brandStats = {};
            currentConfig.courseData.forEach(c => {
                catStats[c.level].t += c.points; max += c.points;
                if ((userState.completedCourses || []).includes(c.id)) {
                    total += c.points; catStats[c.level].c += c.points;
                    if (c.brand) brandStats[c.brand] = (brandStats[c.brand] || 0) + 1;
                }
            });

            // 核心邏輯修正：5階段 LV 劃分 (總分除以五)
            const interval = max / 5;
            let lv = 1;
            let nextThreshold = null;
            let nextLabel = "";
            
            if (max > 0) {
                if (total >= max) {
                    lv = 5;
                    nextThreshold = null;
                } else {
                    // 計算目前所處等級 (1~5)
                    lv = Math.floor(total / interval) + 1;
                    if (lv > 5) lv = 5;

                    if (lv < 5) {
                        nextThreshold = lv * interval;
                        nextLabel = "Lv " + (lv + 1);
                    } else {
                        // 雖然在 Lv 5 但未滿 100%
                        nextThreshold = max;
                        nextLabel = "100% 達成";
                    }
                }
            }

            document.getElementById('displayLevel').innerText = 'Lv ' + lv;
            document.getElementById('displayTotalScore').innerText = total;
            document.getElementById('displayMaxScore').innerText = max;
            document.getElementById('displayScoreRatio').innerText = max === 0 ? '0%' : Math.round((total / max) * 100) + '%';
            
            if (nextThreshold !== null) {
                const diff = Math.ceil(nextThreshold - total);
                document.getElementById('displayDistToUpgrade').innerText = diff;
                document.getElementById('nextLevelName').innerText = nextLabel;
                
                // 進度條計算：在目前等級區間內的進度
                const prevThreshold = (lv - 1) * interval;
                const progressInLv = ((total - prevThreshold) / interval) * 100;
                document.getElementById('levelProgressBar').style.width = Math.max(0, Math.min(100, progressInLv)) + '%';
            } else {
                document.getElementById('displayDistToUpgrade').innerText = 'MAX';
                document.getElementById('nextLevelName').innerText = '已達計畫上限';
                document.getElementById('levelProgressBar').style.width = '100%';
            }

            document.getElementById('dashboardAnalysis').innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase tracking-widest">階段指標</th><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase tracking-widest">積分</th><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase tracking-widest">完成度</th></tr></thead>
                        <tbody class="divide-y divide-gray-50">
                            <tr><td class="px-6 py-4 text-sm font-bold text-amber-700">核心必修項目</td><td class="px-6 py-4 text-sm font-bold">${(userState.completedInitial || []).length}/${currentConfig.initialCourses.length}</td><td class="px-6 py-4"><div class="w-12 h-1 bg-gray-100 rounded-full"><div class="h-full bg-amber-500" style="width: ${currentConfig.initialCourses.length === 0 ? 0 : Math.round(((userState.completedInitial || []).length / currentConfig.initialCourses.length) * 100)}%"></div></div></td></tr>
                            ${Object.entries(catStats).map(([n, d]) => {
                                const p = d.t === 0 ? 0 : Math.round((d.c / d.t) * 100);
                                return `<tr><td class="px-6 py-4 text-sm font-bold text-gray-700">${n}</td><td class="px-6 py-4 text-sm font-bold">${d.c}/${d.t}</td><td class="px-6 py-4"><div class="w-12 h-1 bg-gray-100 rounded-full transition-all"><div class="h-full bg-blue-500" style="width: ${p}%"></div></div></td></tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase tracking-widest">品牌掌握</th><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400 uppercase tracking-widest">熟練堂數</th></tr></thead>
                        <tbody class="divide-y divide-gray-50">
                            ${Object.entries(brandStats).length === 0 ? '<tr><td colspan="2" class="px-6 py-4 text-xs text-gray-400 italic text-center">尚未達成任何品牌項目</td></tr>' : Object.entries(brandStats).map(([n, c]) => `<tr><td class="px-6 py-4 text-sm font-bold text-gray-700">${n}</td><td class="px-6 py-4 text-sm font-black text-indigo-600">${c} 堂</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('initialProgress').innerText = `${(userState.completedInitial || []).length}/${currentConfig.initialCourses.length}`;
        }

        function setConnStatus(msg, colorClass) {
            const el = document.getElementById('syncStatus');
            el.innerHTML = `<i class="fas fa-check-circle mr-1"></i>${msg}`;
            el.className = `ml-4 px-2 py-1 rounded text-[10px] font-bold transition-all bg-white border border-gray-100 ${colorClass}`;
        }

        window.onload = init;

    </script>
</body>
</html>
