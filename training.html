<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素組教育訓練系統 v1.6.9 (Connection & Tailoring Fix)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        
        .custom-checkbox input:checked + div {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .custom-checkbox input:checked + div svg {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-900">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center p-6 text-center">
        <div id="loadingCore">
            <div class="spinner mb-4 mx-auto"></div>
            <p class="text-gray-500 animate-pulse font-bold text-lg">系統啟動中...</p>
            <p id="loadingStatus" class="text-gray-400 text-xs mt-2">正在初始化連線...</p>
        </div>
        <div id="loadingError" class="hidden max-w-sm">
            <i class="fas fa-exclamation-triangle text-amber-500 text-5xl mb-4"></i>
            <h3 class="font-bold text-gray-800 text-xl">連線較慢</h3>
            <p class="text-gray-500 text-sm mt-2 mb-6">雲端連線反應時間較長，您可以嘗試「進入離線模式」先行編輯，或重新整理頁面。</p>
            <div class="flex flex-col gap-2">
                <button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg">重新嘗試</button>
                <button onclick="skipLoading()" class="bg-gray-100 text-gray-500 px-6 py-3 rounded-xl font-bold">進入離線預覽</button>
            </div>
        </div>
    </div>

    <!-- Top Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-black bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                        <i class="fas fa-graduation-cap mr-2"></i>教育訓練系統 v1.6.9
                    </span>
                    <span id="syncStatus" class="ml-4 px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-100 text-gray-400">
                        <i class="fas fa-wifi-slash mr-1"></i>尚未同步
                    </span>
                </div>
                <div class="flex items-center space-x-1 md:space-x-2">
                    <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn active px-3 py-2 rounded-md text-sm font-medium border border-transparent">儀表板</button>
                    <button onclick="switchTab('initial')" id="btn-initial" class="nav-btn px-3 py-2 rounded-md text-sm font-medium border border-transparent">必修</button>
                    <button onclick="switchTab('courses')" id="btn-courses" class="nav-btn px-3 py-2 rounded-md text-sm font-medium border border-transparent">評分</button>
                    <button onclick="switchTab('admin')" id="btn-admin" class="nav-btn px-3 py-2 rounded-md text-sm font-medium border border-rose-200 text-rose-600 hover:bg-rose-50"><i class="fas fa-user-shield mr-1"></i>管理端</button>
                    <button onclick="exportToExcel()" class="hidden md:block text-emerald-600 px-2 hover:bg-emerald-50 rounded"><i class="fas fa-file-excel"></i></button>
                    <button onclick="resetData()" class="text-rose-600 px-2 hover:bg-rose-50 rounded"><i class="fas fa-redo-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">

        <!-- TAB 1: DASHBOARD -->
        <div id="dashboard" class="tab-content active space-y-6">
            <div class="bg-indigo-600 rounded-xl shadow-lg p-6 text-white border-b-4 border-indigo-800">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-lg font-bold"><i class="fas fa-sync-alt mr-2"></i>識別碼連線</h2>
                        <p class="text-xs opacity-70 mt-1 text-indigo-100">輸入您的專屬 ID，系統將自動載入「全域」或管理者為您「量身規劃」的課程。</p>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="syncKey" class="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-white/50 w-full md:w-64" placeholder="輸入您的 ID">
                        <button onclick="applySync()" class="bg-white text-indigo-600 px-6 py-2 rounded-lg font-bold hover:bg-indigo-50 transition-colors shadow-md">同步進度</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">姓名</label>
                        <input type="text" id="userName" oninput="debouncedSave()" class="block w-full rounded-lg border-gray-200 shadow-sm sm:text-sm border p-2.5 bg-gray-50 font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">區域</label>
                        <select id="userRegion" onchange="debouncedSave()" class="block w-full rounded-lg border-gray-200 shadow-sm sm:text-sm border p-2.5 bg-gray-50 font-bold">
                            <option value="">選擇區域</option>
                            <option value="北區">北區</option>
                            <option value="中區">中區</option>
                            <option value="南區">南區</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">到職日</label>
                        <input type="date" id="startDate" oninput="debouncedSave()" class="block w-full rounded-lg border-gray-200 shadow-sm sm:text-sm border p-2.5 bg-gray-50 font-bold">
                    </div>
                    <div class="flex flex-col justify-center items-center md:items-end">
                        <div id="displayLevel" class="text-5xl font-black text-blue-600 italic">Lv 0</div>
                        <div class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest font-bold">Rank</div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white border-l-8 border-blue-600 rounded-xl shadow-sm p-6">
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">總積分</div>
                    <div class="text-4xl font-black mt-1 text-gray-800" id="displayTotalScore">0</div>
                    <div class="mt-4 text-xs font-bold text-blue-600 bg-blue-50 inline-block px-2 py-1 rounded">達成率: <span id="displayScoreRatio">0%</span></div>
                </div>
                <div class="bg-white border-l-8 border-amber-500 rounded-xl shadow-sm p-6 flex flex-col justify-between">
                    <div>
                        <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">晉升 <span id="nextLevelName" class="text-amber-600">--</span></div>
                        <div class="flex items-baseline">
                            <span class="text-4xl font-black text-gray-800" id="displayDistToUpgrade">--</span>
                            <span class="ml-2 text-gray-400 text-xs italic">pts left</span>
                        </div>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-2 mt-4 overflow-hidden">
                        <div class="bg-amber-500 h-2 rounded-full transition-all duration-1000" id="levelProgressBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="bg-white border-l-8 border-emerald-500 rounded-xl shadow-sm p-6">
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">計畫類別</div>
                    <div class="text-2xl font-black text-gray-800 mt-2" id="planTypeDisplay">載入中...</div>
                    <div class="mt-3 flex items-center text-[10px] text-emerald-600 font-bold italic">
                        <i class="fas fa-trophy mr-1"></i> 目標分數: <span id="displayMaxScore" class="ml-1">0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="dashboardAnalysis">
                <!-- Content generated via JS -->
            </div>
        </div>

        <!-- TAB 2: INITIAL -->
        <div id="initial" class="tab-content space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-100 bg-amber-50 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-amber-900">必修核心計畫</h3>
                        <p class="text-xs text-amber-700 mt-1" id="initialPlanName">預設課程</p>
                    </div>
                    <div class="text-xs font-bold text-amber-800 bg-white px-3 py-1 rounded-full border border-amber-200">
                        進度: <span id="initialProgress">0/0</span>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-100 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400">狀態</th>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400">類別</th>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400">名稱</th>
                                <th class="px-4 py-3 text-left text-[10px] font-bold text-gray-400">講師</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50" id="initialCourseList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 3: COURSES -->
        <div id="courses" class="tab-content space-y-6">
            <div id="scoredCourseSections" class="space-y-6"></div>
        </div>

        <!-- TAB 4: ADMIN -->
        <div id="admin" class="tab-content space-y-6">
            <div id="adminLogin" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 border border-gray-200 mt-10 text-center">
                <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-user-lock text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black text-gray-800">管理端後台</h2>
                <input type="password" id="adminPass" class="block w-full mt-6 rounded-xl border-gray-200 shadow-sm p-4 border bg-gray-50 text-center font-bold tracking-widest" placeholder="••••••••">
                <button onclick="loginAdmin()" class="w-full mt-4 bg-rose-600 text-white font-bold py-4 rounded-xl shadow-lg">進入編輯模式</button>
            </div>

            <div id="adminPanel" class="hidden space-y-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-gray-400 mb-2">編輯模式</label>
                        <div class="flex items-center gap-4">
                            <select id="adminTargetType" onchange="toggleAdminScope()" class="bg-gray-100 border border-gray-200 rounded-lg px-4 py-2 font-bold">
                                <option value="global">全域標竿計畫 (預設)</option>
                                <option value="custom">特定人員量身規劃 (專屬)</option>
                            </select>
                            <div id="targetUserIdContainer" class="hidden flex items-center gap-2">
                                <input type="text" id="targetSyncId" class="border border-gray-200 rounded-lg px-4 py-2 w-48 font-bold" placeholder="輸入人員 ID">
                                <button onclick="loadConfigForAdmin(document.getElementById('targetSyncId').value)" class="bg-rose-100 text-rose-600 px-4 py-2 rounded-lg font-bold">載入</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="saveAdminConfig()" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg">發布變更</button>
                        <button onclick="logoutAdmin()" class="bg-gray-100 text-gray-500 px-6 py-3 rounded-xl font-bold">退出</button>
                    </div>
                </div>

                <div id="adminListsContainer" class="grid grid-cols-1 gap-8">
                    <!-- Lists generated via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config
        const apiKey = ""; 
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: apiKey,
            authDomain: "training-834e3.firebaseapp.com",
            projectId: "training-834e3",
            storageBucket: "training-834e3.firebasestorage.app",
            messagingSenderId: "284421517335",
            appId: "1:284421517335:web:19e2d463497126b8ccac52"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : "element-training-v1-6-9";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Constants & Defaults
        const FALLBACK = {
            initialCourses: [
                { id: 'i1', category: '管理部', name: '繳交個人資料', lecturer: '王淑英' },
                { id: 'i2', category: '管理部', name: '辦公室介紹', lecturer: '許鏸文' }
            ],
            courseData: [
                { id: 'c1', level: '新手篇', category: '核心', name: '自我介紹', points: 5, desc: 'Line 群組自我介紹' }
            ]
        };

        let currentConfig = JSON.parse(JSON.stringify(FALLBACK));
        let adminEditing = JSON.parse(JSON.stringify(FALLBACK));
        let userState = { userInfo: { name: '', region: '', startDate: '' }, completedInitial: [], completedCourses: [] };

        let syncId = null;
        let unsubscribe = null;
        let saveTimer = null;
        let isAdmin = false;
        let currentUser = null;

        // --- Core Init ---

        async function init() {
            const safety = setTimeout(() => {
                if (document.getElementById('loadingOverlay').classList.contains('hidden')) return;
                document.getElementById('loadingCore').classList.add('hidden');
                document.getElementById('loadingError').classList.remove('hidden');
            }, 10000);

            try {
                document.getElementById('loadingStatus').innerText = "驗證身分中...";
                
                // Mandatory Rule: Auth FIRST and AWAIT it
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Wait for user to be ready
                onAuthStateChanged(auth, async (user) => {
                    currentUser = user;
                    if (!user) return;

                    try {
                        document.getElementById('loadingStatus').innerText = "下載全域訓練計畫...";
                        // Collection: configs, Doc: global
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'global');
                        const snap = await getDoc(docRef);
                        if (snap.exists()) {
                            currentConfig = snap.data();
                        } else {
                            // Seed default if not exists
                            await setDoc(docRef, FALLBACK);
                        }

                        renderAll();
                        
                        const lastId = localStorage.getItem('training_id');
                        if (lastId) {
                            document.getElementById('syncKey').value = lastId;
                            await applySync();
                        } else {
                            updateStats();
                        }

                        clearTimeout(safety);
                        document.getElementById('loadingOverlay').classList.add('hidden');
                    } catch (innerErr) {
                        console.error("Firestore Init Error:", innerErr);
                        document.getElementById('loadingStatus').innerText = "資料庫存取受限，進入離線模式...";
                    }
                });

            } catch (err) {
                console.error("Init Error:", err);
                document.getElementById('loadingStatus').innerText = "連線失敗，準備進入...";
            }
        }

        window.skipLoading = () => document.getElementById('loadingOverlay').classList.add('hidden');

        // --- Data Logic ---

        window.applySync = async () => {
            const id = document.getElementById('syncKey').value.trim();
            if (!id || !currentUser) return;
            
            if (unsubscribe) unsubscribe();
            syncId = id;
            localStorage.setItem('training_id', id);
            setSyncing(true, "讀取個人計畫...");

            try {
                // Rule 1 paths
                const customRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', `user_${id}`);
                const globalRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'global');
                
                let snap = await getDoc(customRef);
                if (snap.exists()) {
                    currentConfig = snap.data();
                    document.getElementById('planTypeDisplay').innerText = "量身專屬計畫";
                } else {
                    const gSnap = await getDoc(globalRef);
                    currentConfig = gSnap.exists() ? gSnap.data() : FALLBACK;
                    document.getElementById('planTypeDisplay').innerText = "全域標竿計畫";
                }

                renderAll();

                // Listen to records
                const recordRef = doc(db, 'artifacts', appId, 'public', 'data', 'training_records', id);
                unsubscribe = onSnapshot(recordRef, (s) => {
                    if (s.exists()) {
                        userState = s.data();
                        document.getElementById('userName').value = userState.userInfo.name || '';
                        document.getElementById('userRegion').value = userState.userInfo.region || '';
                        document.getElementById('startDate').value = userState.userInfo.startDate || '';
                    } else {
                        userState = { userInfo: { name: '', region: '', startDate: '' }, completedInitial: [], completedCourses: [] };
                    }
                    updateStats();
                    setSyncing(false);
                }, (err) => { 
                    console.error("Snapshot error:", err);
                    setSyncing(false, "同步失敗"); 
                });
            } catch (err) { 
                console.error(err);
                setSyncing(false, "權限不足或網路異常"); 
            }
        };

        window.debouncedSave = () => {
            userState.userInfo.name = document.getElementById('userName').value;
            userState.userInfo.region = document.getElementById('userRegion').value;
            userState.userInfo.startDate = document.getElementById('startDate').value;
            updateStats();
            
            if (!syncId || !currentUser) return;
            setSyncing(true, "儲存...");
            clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'training_records', syncId);
                    await setDoc(docRef, userState);
                    setSyncing(false);
                } catch (e) { console.error(e); }
            }, 1000);
        };

        // --- Admin Core ---

        window.loginAdmin = () => {
            if (document.getElementById('adminPass').value === 'admin888') {
                isAdmin = true;
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadConfigForAdmin('global');
            } else { alert("金鑰錯誤"); }
        };

        window.logoutAdmin = () => {
            isAdmin = false;
            document.getElementById('adminLogin').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminPass').value = '';
        };

        async function loadConfigForAdmin(tid) {
            if (!currentUser) return;
            const docId = tid && tid !== 'global' ? `user_${tid}` : 'global';
            setSyncing(true, `載入: ${docId}`);
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', docId);
                const snap = await getDoc(docRef);
                adminEditing = snap.exists() ? snap.data() : JSON.parse(JSON.stringify(FALLBACK));
                renderAdminEditor();
            } catch (err) { console.error(err); }
            finally { setSyncing(false); }
        }
        window.loadConfigForAdmin = loadConfigForAdmin;

        window.saveAdminConfig = async () => {
            if (!currentUser) return;
            const scope = document.getElementById('adminTargetType').value;
            let docId = 'global';
            if (scope === 'custom') {
                const tid = document.getElementById('targetSyncId').value.trim();
                if (!tid) return alert("請輸入對象 ID");
                docId = `user_${tid}`;
            }

            if (!confirm(`發布計畫至「${docId}」？此操作會立即覆蓋雲端設定。`)) return;

            setSyncing(true, "正在發布...");
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'configs', docId);
                await setDoc(docRef, adminEditing);
                alert("發布成功！");
                if (syncId === (docId === 'global' ? syncId : docId.replace('user_', ''))) {
                    location.reload(); 
                }
            } catch (err) {
                console.error(err);
                alert("發布失敗，權限不足。");
            } finally { setSyncing(false); }
        };

        // --- Render Engine ---

        function renderAll() {
            renderInitialList();
            renderScoredSections();
        }

        function renderInitialList() {
            document.getElementById('initialCourseList').innerHTML = currentConfig.initialCourses.map(c => `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3">
                        <label class="custom-checkbox flex items-center cursor-pointer">
                            <input type="checkbox" class="hidden" data-id="${c.id}" onchange="toggleInitial('${c.id}')">
                            <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center"><svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                        </label>
                    </td>
                    <td class="px-4 py-3 text-[10px] text-gray-400 font-bold uppercase">${c.category}</td>
                    <td class="px-4 py-3 text-gray-900 font-bold">${c.name}</td>
                    <td class="px-4 py-3 text-xs text-gray-500">${c.lecturer}</td>
                </tr>
            `).join('');
            document.getElementById('initialPlanName').innerText = syncId ? `${syncId} 的進度` : "預設必修";
        }

        function renderScoredSections() {
            const levels = ['新手篇', '理解篇', '規劃篇', '團隊合作篇', '自我成長'];
            document.getElementById('scoredCourseSections').innerHTML = levels.map(lv => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 bg-gray-50/50 flex justify-between items-center cursor-pointer hover:bg-gray-100" onclick="toggleSection('sec-${lv}')">
                        <h3 class="font-black text-gray-700 uppercase tracking-wide text-sm">${lv}</h3>
                        <i class="fas fa-chevron-down text-gray-300"></i>
                    </div>
                    <div id="sec-${lv}" class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-100 text-sm">
                            <tbody class="divide-y divide-gray-50">
                                ${currentConfig.courseData.filter(c => c.level === lv).map(c => `
                                    <tr class="hover:bg-blue-50/30">
                                        <td class="w-16 px-4 py-3 text-center">
                                            <label class="custom-checkbox inline-flex items-center cursor-pointer">
                                                <input type="checkbox" class="hidden" data-id="${c.id}" onchange="toggleCourse('${c.id}')">
                                                <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center"><svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                                            </label>
                                        </td>
                                        <td class="px-4 py-3 text-indigo-600 font-black text-xs w-32">${c.brand || c.category}</td>
                                        <td class="px-4 py-3 text-gray-800 font-bold">${c.name}</td>
                                        <td class="px-4 py-3 font-black text-blue-600">${c.points}</td>
                                        <td class="px-4 py-3 text-xs text-gray-400 italic">${c.desc || ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `).join('');
        }

        function renderAdminEditor() {
            let html = `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 bg-amber-50 border-b border-amber-100 flex justify-between items-center">
                        <h3 class="font-black text-amber-900">1. 必修課程</h3>
                        <button onclick="adminAdd('i')" class="bg-amber-600 text-white px-3 py-1 rounded text-xs">+ 新增</button>
                    </div>
                    <div class="p-6 space-y-3">
                        ${adminEditing.initialCourses.map(c => `
                            <div class="grid grid-cols-1 md:grid-cols-6 gap-2 p-3 bg-gray-50 rounded-lg">
                                <input type="text" value="${c.category}" oninput="adminUpdate('i', '${c.id}', 'category', this.value)" class="text-xs p-2 border rounded font-bold">
                                <input type="text" value="${c.name}" oninput="adminUpdate('i', '${c.id}', 'name', this.value)" class="col-span-3 text-xs p-2 border rounded font-bold">
                                <input type="text" value="${c.lecturer}" oninput="adminUpdate('i', '${c.id}', 'lecturer', this.value)" class="text-xs p-2 border rounded">
                                <button onclick="adminDel('i', '${c.id}')" class="text-rose-500"><i class="fas fa-trash"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 bg-blue-50 border-b border-blue-100 flex justify-between items-center">
                        <h3 class="font-black text-blue-900">2. 積分課程</h3>
                        <button onclick="adminAdd('c')" class="bg-blue-600 text-white px-3 py-1 rounded text-xs">+ 新增</button>
                    </div>
                    <div class="p-6 space-y-3">
                        ${adminEditing.courseData.map(c => `
                            <div class="grid grid-cols-1 md:grid-cols-7 gap-2 p-3 bg-gray-50 rounded-lg">
                                <select onchange="adminUpdate('c', '${c.id}', 'level', this.value)" class="text-[10px] p-2 border rounded font-bold">
                                    ${['新手篇','理解篇','規劃篇','團隊合作篇','自我成長'].map(l => `<option ${c.level === l ? 'selected' : ''}>${l}</option>`).join('')}
                                </select>
                                <input type="text" value="${c.brand || ''}" oninput="adminUpdate('c', '${c.id}', 'brand', this.value)" class="text-[10px] p-2 border rounded" placeholder="品牌">
                                <input type="text" value="${c.category}" oninput="adminUpdate('c', '${c.id}', 'category', this.value)" class="text-[10px] p-2 border rounded">
                                <input type="text" value="${c.name}" oninput="adminUpdate('c', '${c.id}', 'name', this.value)" class="col-span-2 text-[10px] p-2 border rounded font-bold">
                                <input type="number" value="${c.points}" oninput="adminUpdate('c', '${c.id}', 'points', this.value)" class="text-[10px] p-2 border rounded font-black text-blue-600">
                                <button onclick="adminDel('c', '${c.id}')" class="text-rose-500"><i class="fas fa-trash"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('adminListsContainer').innerHTML = html;
        }

        // --- UI Helpers ---

        window.toggleInitial = (id) => { if (userState.completedInitial.includes(id)) userState.completedInitial = userState.completedInitial.filter(x => x !== id); else userState.completedInitial.push(id); debouncedSave(); };
        window.toggleCourse = (id) => { if (userState.completedCourses.includes(id)) userState.completedCourses = userState.completedCourses.filter(x => x !== id); else userState.completedCourses.push(id); debouncedSave(); };
        window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
        window.toggleAdminScope = () => {
            const scope = document.getElementById('adminTargetType').value;
            document.getElementById('targetUserIdContainer').classList.toggle('hidden', scope !== 'custom');
            if (scope === 'global') loadConfigForAdmin('global');
        };

        window.adminAdd = (t) => {
            if (t === 'i') adminEditing.initialCourses.push({ id: 'i'+Date.now(), category: '管理', name: '新課程', lecturer: '' });
            else adminEditing.courseData.push({ id: 'c'+Date.now(), level: '新手篇', category: '通用', name: '新項目', points: 1, desc: '' });
            renderAdminEditor();
        };
        window.adminDel = (t, id) => {
            if (t === 'i') adminEditing.initialCourses = adminEditing.initialCourses.filter(x => x.id !== id);
            else adminEditing.courseData = adminEditing.courseData.filter(x => x.id !== id);
            renderAdminEditor();
        };
        window.adminUpdate = (t, id, f, v) => {
            const l = t === 'i' ? adminEditing.initialCourses : adminEditing.courseData;
            const i = l.find(x => x.id === id);
            if (i) i[f] = f === 'points' ? (parseInt(v) || 0) : v;
        };

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            const btn = document.getElementById('btn-' + id);
            if(btn) btn.classList.add('active');
            if (id === 'admin' && isAdmin) renderAdminEditor();
        };

        function updateStats() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                const id = cb.getAttribute('data-id');
                cb.checked = (userState.completedInitial || []).includes(id) || (userState.completedCourses || []).includes(id);
            });
            let total = 0, max = 0;
            const stats = { '新手篇': {t:0, c:0}, '理解篇': {t:0, c:0}, '規劃篇': {t:0, c:0}, '團隊合作篇': {t:0, c:0}, '自我成長': {t:0, c:0} };
            const brandStats = {};
            currentConfig.courseData.forEach(c => {
                stats[c.level].t += c.points; max += c.points;
                if ((userState.completedCourses || []).includes(c.id)) {
                    total += c.points; stats[c.level].c += c.points;
                    if (c.brand) brandStats[c.brand] = (brandStats[c.brand] || 0) + 1;
                }
            });
            const iD = (userState.completedInitial || []).length, iT = currentConfig.initialCourses.length, iPct = iT === 0 ? 0 : Math.round((iD / iT) * 100);
            document.getElementById('displayTotalScore').innerText = total;
            document.getElementById('displayMaxScore').innerText = max;
            document.getElementById('displayScoreRatio').innerText = max === 0 ? '0%' : Math.round((total / max) * 100) + '%';
            
            const th = [{level:0, min:0, next:15}, {level:1, min:15, next:65}, {level:2, min:65, next:180}, {level:3, min:180, next:350}, {level:4, min:350, next:430}, {level:5, min:430, next:null}];
            let cur = th[0]; for(let l of th) { if(total >= l.min) cur = l; else break; }
            document.getElementById('displayLevel').innerText = 'Lv ' + cur.level;
            if (cur.next) {
                document.getElementById('displayDistToUpgrade').innerText = cur.next - total;
                document.getElementById('nextLevelName').innerText = 'Lv ' + (cur.level + 1);
                document.getElementById('levelProgressBar').style.width = ((total - cur.min) / (cur.next - cur.min) * 100) + '%';
            } else {
                document.getElementById('displayDistToUpgrade').innerText = 'MAX'; document.getElementById('nextLevelName').innerText = 'MAX'; document.getElementById('levelProgressBar').style.width = '100%';
            }

            document.getElementById('dashboardAnalysis').innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400">類別</th><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400">得分</th><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400">進度</th></tr></thead>
                        <tbody class="divide-y divide-gray-50">
                            <tr><td class="px-6 py-4 text-sm font-bold text-amber-700">必修核心</td><td class="px-6 py-4 text-sm font-bold">${iD}/${iT}</td><td class="px-6 py-4"><div class="w-12 h-1 bg-gray-100 rounded-full"><div class="h-full bg-amber-500" style="width: ${iPct}%"></div></div></td></tr>
                            ${Object.entries(stats).map(([n, d]) => {
                                const p = d.t === 0 ? 0 : Math.round((d.c / d.t) * 100);
                                return `<tr><td class="px-6 py-4 text-sm font-bold text-gray-700">${n}</td><td class="px-6 py-4 text-sm font-bold">${d.c}/${d.t}</td><td class="px-6 py-4"><div class="w-12 h-1 bg-gray-100 rounded-full"><div class="h-full bg-blue-500" style="width: ${p}%"></div></div></td></tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400">品牌</th><th class="px-6 py-3 text-left text-[10px] font-bold text-gray-400">完成項目</th></tr></thead>
                        <tbody class="divide-y divide-gray-50">
                            ${Object.entries(brandStats).length === 0 ? '<tr><td colspan="2" class="px-6 py-4 text-xs text-gray-400 italic">尚無完成品牌項目</td></tr>' : Object.entries(brandStats).map(([n, c]) => `<tr><td class="px-6 py-4 text-sm font-bold text-gray-700">${n}</td><td class="px-6 py-4 text-sm font-black text-indigo-600">${c}</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('initialProgress').innerText = `${iD}/${iT}`;
        }

        function setSyncing(s, m) {
            const el = document.getElementById('syncStatus');
            if (s) {
                el.innerHTML = `<i class="fas fa-sync animate-spin mr-1"></i>${m}`;
                el.className = "ml-4 px-2 py-1 rounded text-[10px] font-bold bg-blue-100 text-blue-700";
            } else {
                el.innerHTML = `<i class="fas fa-check-circle mr-1"></i>連線中 (${syncId || '未登入'})`;
                el.className = "ml-4 px-2 py-1 rounded text-[10px] font-bold bg-green-100 text-green-700";
            }
        }

        window.onload = init;

    </script>
</body>
</html>
